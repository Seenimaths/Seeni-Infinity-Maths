                {q: "3. \\(A=\\\\{a,b,c\\\\}\\), \\(B=\\\\{2,3\\\\}\\), \\(C=\\\\{a,b,c,d\\\\}\\) எனில் \\(n[(A\\cap C)\\times B]\\)", o: ["4", "8", "6", "12"], c: 2, s: "\\(A\\cap C=\\\\{a,b,c\\\\}\\) (3 உறுப்புகள்). B-யில் 2 உறுப்புகள். \\(3 \\times 2 = 6\\)"},

                {q: "5. சார்பு \\(f:\\mathbb{N}\\rightarrow\\mathbb{N}\\) ஆனது \\(f(x)=2x\\) என வரையறுக்கப்படுகிறது எனில் f ஆனது எவ்வகைச் சார்பு?", o: ["ஒன்றுக்கு ஒன்றானது ஆனால் மேல் சார்பு இல்லை", "ஒன்றுக்கு ஒன்றானதும் இல்லை மற்றும் மேல்சார்பும் இல்லை", "ஒன்றுக்கு ஒன்றானது இலலை ஆனால் மேல் சார்பு", "ஒன்றுக்கு ஒன்றான மற்றும் மேல்சார்பு"], c: 3, s: "ஒன்றுக்கு ஒன்றான மற்றும் மேல்சார்பு."},

                {q: "7. ஒரு சார்பு \\(t(c)=\\frac{9c}{5}+32\\) என வரையறுக்கப்படுகிறது. ஃபாரன்ஹீட் வெப்பநிலை 95°க்கு c ன் மதிப்பானது", o: ["37", "36", "35", "29"], c: 2, s: "\\(95 = \\frac{9c}{5}+32 \\Rightarrow \\frac{9c}{5} = 63 \\Rightarrow c = \\frac{63 \\times 5}{9} = 35\\)"},

                {q: "9. f என்ற மாறிலிச் சார்பை \\(\\frac{1}{10}\\) என்க. \\(f(1)+f(2)+........+f(100)\\) ன் மதிப்பானது", o: ["\\(\\frac{1}{10}\\)", "10", "100", "\\(\\frac{1}{100}\\)"], c: 1, s: "மாறிலி சார்பு என்பதால், \\(100 \\times \\frac{1}{10} = 10\\)"},

                {q: "13. \\(f(x)+f(1-x)=2\\) எனில் \\(f(\\frac{1}{2})\\) ன் மதிப்பு", o: ["1", "-1", "5", "-9"], c: 0, s: "\\(x=\\frac{1}{2}\\) எனப் பிரதியிட: \\(f(\\frac{1}{2})+f(\\frac{1}{2})=2 \\Rightarrow 2f(\\frac{1}{2})=2 \\Rightarrow f(\\frac{1}{2})=1\\)"},

                {q: "2. 60002 மற்றும் 601 ஆகியவற்றின் வித்தியாசத்தை 6ஆல் வகுக்கும்போது கிடைக்கும் மீதி", o: ["2", "1", "0", "3"], c: 1, s: "வித்தியாசம் = \\(59401\\). 6 ஆல் வகுத்தால் மீதி = 1"},

                {q: "11. p, q, r, x, y, z என்பன ஒரு கூட்டுத்தொடர்வரிசையில் இருப்பின் \\(5p+3, 5q+3, 5r+3, 5x+3, 5y+3, 5z+3\\) என்பது", o: ["ஒரு பெருக்குத்தொடர்வரிசை", "ஒரு கூட்டுத்தொடர்வரிசை", "ஒரு மாறிலி தொடர்வரிசை", "ஒரு கூட்டுத்தொடர்வரிசையுமல்ல, பெருக்குத்தொடர்வரிசையுமல்ல"], c: 1, s: "ஒரே மாறிலியால் பெருக்கி கூட்டினாலும் அது கூட்டுத்தொடர்வரிசையாகவே இருக்கும்."},
                {q: "12. கொடுக்கப்பட்ட ஒரு சதுரத்தின் பக்கங்களின் மையப்புள்ளிகளை இணைத்து மற்றொரு சதுரம் உருவாக்கப்படுகிறது... முதல் சதுரத்தின் பக்கம் 4 செ.மீ எனில், எல்லாச் சதுரங்களின் பரப்பளவுகளின் கூடுதல்", o: ["8 ச.செ.மீ", "16 ச.செ.மீ", "32 ச.செ.மீ", "64 ச.செ.மீ"], c: 2, s: "பரப்பளவுகள்: \\(16, 8, 4...\\) முடிவிலி பெருக்குத்தொடர் கூடுதல் \\(= \\frac{16}{1 - 0.5} = 32\\)"},
                {q: "13. ஒரு கூட்டுத்தொடர்வரிசையின் 8-வது மற்றும் 12வது உறுப்புகள் முறையே 39 மற்றும் 59 எனில், அதன் முதல் உறுப்பு", o: ["5", "6", "4", "3"], c: 2, s: "\\(a+7d=39\\) மற்றும் \\(a+11d=59\\). தீர்க்க: \\(d=5, a=4\\)"},
                {q: "14. 'a' மற்றும் 'b' என்பன இருமிகை முழுக்கள். இங்கு a > b மற்றும் 'b' என்பது 'a' யின் ஒரு காரணி எனில் (a,b) யின் மீ.பொ.வ", o: ["b", "a", "ab", "\\(\\frac{a}{b}\\)"], c: 0, s: "b ஆனது a இன் காரணி என்பதால் மீ.பொ.வ (HCF) b ஆகும்."},
                {q: "15. m மற்றும் n என்பவை சார்பகா எண்கள் எனில், \\(m^{2}\\) மற்றும் \\(n^{2}\\) ஆனது", o: ["சார்பகா எண்கள்", "சார்பகா எண்கள் அல்ல", "இரட்டைப்படை எண்", "ஒற்றைப்படை எண்"], c: 0, s: "சார்பகா எண்களின் வர்க்கங்களும் சார்பகா எண்களாகவே இருக்கும்."},
                {q: "16. a என்ற எண்ணின் மிகச்சிறிய பகாக்காரணி 3 மற்றும் b என்ற எண்ணின் மிகச்சிறிய பகாக்காரணி 7 எனில் a+b யின் மிகச்சிறிய பகாக்காரணி", o: ["\\(a+b\\)", "2", "5", "10"], c: 1, s: "இரண்டும் ஒற்றைப்படை எண்கள். அவற்றின் கூடுதல் இரட்டைப்படை எண். இரட்டைப்படை எண்ணின் மீச்சிறு பகாக்காரணி 2."},
                {q: "17. a, 3a, 5a,.... என்ற தொடரின் முதல் 'n' உறுப்புகளின் கூடுதல்", o: ["na", "\\((2n-1)a\\)", "\\(n^{2}a\\)", "\\(n^{2}a^{2}\\)"], c: 2, s: "முதல் n ஒற்றைப்படை எண்களின் கூடுதல் \\(n^2\\). எனவே விடை \\(n^2a\\). "},
                {q: "18. மிகச்சிறிய பகா எண் மற்றும் மிகச்சிறிய பகு எண் ஆகியவற்றின் மீ.பொ.வ என்ன?", o: ["1", "2", "3", "4"], c: 1, s: "மிகச்சிறிய பகா எண் 2, பகு எண் 4. மீ.பொ.வ = 2."}
            ],
            "3": [
                {q: "1. கீழே கொடுக்கப்பட்டவற்றுள் எது மூன்று மாறிகளில் அமைந்த நேரிய சமன்பாடாகும்?<br>(i) \\(2X=Z\\) (ii) \\(2\\sin X+Y\\cos Y+Z\\tan Z=2\\) (iii) \\(X+2Y^{2}+Z=3\\) (iv) \\(X-Y-Z=7\\)", o: ["(i) மற்றும் (iii) மட்டும்", "(i) மற்றும் (iv) மட்டும்", "(iv) மட்டும்", "அனைத்தும்"], c: 2, s: "\\(X-Y-Z=7\\) என்பது மட்டுமே மூன்று மாறிகளில் அமைந்த நேரிய சமன்பாடு."},
                {q: "2. \\(x^{2}-x-1=0\\) என்ற இருபடி சமன்பாட்டின் மெய்மூலங்கள்", o: ["1, 1", "-1, 1", "\\(\\frac{1+\\sqrt{5}}{2}, \\frac{1-\\sqrt{5}}{2}\\)", "மெய்மூலங்கள் இல்லை"], c: 2, s: "சூத்திர முறை: \\(x = \\frac{-(-1) \\pm \\sqrt{(-1)^2 - 4(1)(-1)}}{2} = \\frac{1 \\pm \\sqrt{5}}{2}\\)"},
                {q: "3. \\(p(x)\\) மற்றும் \\(q(x)\\) என்ற பல்லுறுப்புக்கோவைகளின் மீ.பொ.வ மற்றும் மீ.பொ.ம முறையே \\(2x(x+2)\\) மற்றும் \\(24x(x+2)^{2}(x-2)\\). மேலும் \\(p(x)=8x^{3}+32x^{2}+32x\\) எனில், \\(q(x)\\) ஆனது", o: ["\\(4x^{3}-16x\\)", "\\(6x^{3}-24x\\)", "\\(12x^{3}+24x\\)", "\\(12x^{3}-24x\\)"], c: 1, s: "\\(q(x) = \\frac{\\text{LCM} \\times \\text{HCF}}{p(x)} = 6x(x^2-4) = 6x^3-24x\\)"},
                {q: "4. முடிவிலி எண்ணிக்கையில் உள்ள தீர்வு, கீழ்க்கண்டவற்றில் எந்த வரைபடத்தைக் குறிக்கும்?", o: ["பொதுவான புள்ளி இல்லாத மூன்று தளங்கள்.", "ஒரே புள்ளியில் வெட்டும் மூன்று தளங்கள்.", "மூன்று தளங்களும் ஒரு நேர்க்கோட்டில் வெட்டும் அல்லது ஒன்றன் மீது ஒன்று பொருந்தும்.", "இவற்றில் ஏதுமில்லை."], c: 2, s: "முடிவிலி தீர்வுகள் இருந்தால் தளங்கள் ஒன்றன் மீது ஒன்று பொருந்தும் அல்லது நேர்க்கோட்டில் வெட்டும்."},
                {q: "5. பின்வருவனவற்றில் எது சரியானது?<br>(ii) இரண்டு இருபடி பல்லுறுப்புக்கோவைகளின் மீ.பொ.வ ஒரு மாறிலியாக இருக்கலாம்.<br>(iii) இரண்டு பல்லுறுப்புக்கோவைகளின் மீ.பொ.வ ஒரு மாறிலியாக இருக்கலாம்.", o: ["(i) மற்றும் (ii)", "(iii) மற்றும் (iv)", "(iii) மட்டும்", "(iv) மட்டும்"], c: 2, s: "இரண்டு பல்லுறுப்புக்கோவைகளின் மீ.பொ.வ ஒரு மாறிலியாக இருக்கலாம் என்பது சரி."},
                {q: "6. \\(4m^{2}-24m+36=0\\) ன் வர்க்கமூலம்", o: ["\\(4(m-3)\\)", "\\(2(m-3)\\)", "\\((2m-3)^{2}\\)", "\\((m-3)\\)"], c: 1, s: "\\(4(m^2-6m+9) = 4(m-3)^2\\). இதன் வர்க்கமூலம் \\(2(m-3)\\)."},
                {q: "7. கீழ்க்கண்டவற்றைக் கருதுக:<br>(i) \\(X+Y\\) மற்றும் \\(X^{8}-Y^{8}\\) யின் மீ.பொ.வ \\(X+Y\\)<br>(iv) \\(X-Y\\) மற்றும் \\(X^{8}-Y^{8}\\) யின் மீ.பொ.வ \\(X-Y\\)", o: ["(i) மற்றும் (ii)", "(ii) மற்றும் (iii)", "(i) மற்றும் (iv)", "(ii) மற்றும் (iv)"], c: 2, s: "\\(X^8-Y^8\\) ஆனது \\(X+Y\\) மற்றும் \\(X-Y\\) இரண்டாலும் வகுபடும். எனவே (i) மற்றும் (iv) சரி."},
                {q: "8. எந்த மதிப்புகளுக்கு \\(\\frac{x^{2}+5x+6}{x^{2}+8x+15}\\) என்பது வரையறுக்கப்படவில்லை?", o: ["-3, -5", "5", "-2, -3, -5", "-2, -3"], c: 0, s: "பகுதி \\(x^2+8x+15 = (x+3)(x+5) = 0\\). எனவே \\(x = -3, -5\\)."},
                {q: "9. சுருக்குக: \\(\\frac{x^{2}+7x+12}{x^{2}+8x+15} \\times \\frac{x^{2}+5x}{x^{2}+6x+8}\\)", o: ["\\(x+2\\)", "\\(\\frac{x}{x+2}\\)", "\\(\\frac{35x^{2}+60x}{48x^{2}+120}\\)", "\\(\\frac{1}{x+2}\\)"], c: 1, s: "\\(\\frac{(x+4)(x+3)}{(x+5)(x+3)} \\times \\frac{x(x+5)}{(x+4)(x+2)} = \\frac{x}{x+2}\\)"},
                {q: "10. \\(\\frac{p}{q}=a\\) எனில் \\(\\frac{p^{2}+q^{2}}{p^{2}-q^{2}}\\) என்பது", o: ["\\(\\frac{a^{2}+1}{a^{2}-1}\\)", "\\(\\frac{1+a^{2}}{1-a^{2}}\\)", "\\(\\frac{1-a^{2}}{1+a^{2}}\\)", "\\(\\frac{a^{2}-1}{a^{2}+1}\\)"], c: 0, s: "தொகுதி மற்றும் பகுதியை \\(q^2\\) ஆல் வகுக்க: \\(\\frac{(p/q)^2+1}{(p/q)^2-1} = \\frac{a^2+1}{a^2-1}\\)"},
                {q: "11. பரவளையத்திற்கு செங்குத்தாக அமையும் சமச்சீர் கோடானது பரவளையத்தை", o: ["3 சம பகுதிகளாகப் பிரிக்கும்", "5 சம பகுதிகளாகப் பிரிக்கும்", "2 சம பகுதிகளாகப் பிரிக்கும்", "4 சம பகுதிகளாகப் பிரிக்கும்"], c: 2, s: "சமச்சீர் கோடு பரவளையத்தை சரியாக 2 சம பகுதிகளாகப் பிரிக்கும்."},
                {q: "12. \\(y=-3x^{2}\\) என்ற பரவளையம்", o: ["மேற்புறம் திறந்தவாறு அமையும்", "கீழ்ப்புறம் திறந்தவாறு அமையும்", "வலப்புறம் திறந்தவாறு அமையும்", "இடப்புறம் திறந்தவாறு அமையும்"], c: 1, s: "\\(x^2\\) கெழு குறை எண் (-3) என்பதால் கீழ்ப்புறம் திறந்தவாறு அமையும்."},
                {q: "13. \\((a^{2}-b^{2})x^{2}-(a+b)^{2}x+(a^{3}-b^{3})=0\\) என்ற சமன்பாட்டின் மூலங்களின் கூடுதல் மற்றும் பெருக்கற்பலன்", o: ["\\(\\frac{a^{2}+ab+b^{2}}{a-b}\\)", "\\(\\frac{a+b}{a-b}\\)", "\\(\\frac{a-b}{a+b}\\)", "\\(\\frac{a-b}{a^{2}+ab+b^{2}}\\)"], c: 0, s: "\\(\\text{கூடுதல்} \\times \\text{பெருக்கல்} = \\frac{a+b}{a-b} \\times \\frac{a^2+ab+b^2}{a+b} = \\frac{a^2+ab+b^2}{a-b}\\)"},
                {q: "14. ஒரு பூஜ்ஜியம் 5 மற்றும் பூஜ்ஜியங்களின் கூடுதல் 0 கொண்ட பல்லுறுப்புக் கோவை", o: ["\\(x^{2}-25\\)", "\\(x^{2}-5\\)", "\\(x^{2}-5x\\)", "\\(x^{2}-5x+5\\)"], c: 0, s: "மூலங்கள் 5, -5. சமன்பாடு \\(x^2 - (5-5)x - 25 = 0 \\Rightarrow x^2-25\\)"},
                {q: "15. கீழ்க்கண்டவற்றைக் கருதுக.<br>(ii) ஒவ்வொரு அலகு அணியும் திசையிலி அணியாகும்.<br>(iv) ஒவ்வொரு பூஜ்ஜிய அணியும் திசையிலி அணியாகும்.", o: ["(i) மற்றும் (iii) மட்டும்", "(iii) மட்டும்", "(iv) மட்டும்", "(ii) மற்றும் (iv) மட்டும்"], c: 3, s: "(ii) மற்றும் (iv) சரியானவை."},
                {q: "16. \\(2A+3B=\\begin{bmatrix}2 & -1 & 4\\\\\\\\ 3 & 2 & 5\\end{bmatrix}\\) மற்றும் \\(A+2B=\\begin{bmatrix}5 & 0 & 3\\\\\\\\ 1 & 6 & 2\\end{bmatrix}\\) எனில் B அணி", o: ["\\(\\begin{bmatrix}8 & -1 & -2\\\\\\\\ -1 & 10 & -1\\end{bmatrix}\\)", "\\(\\begin{bmatrix}8 & -1 & 2\\\\\\\\ -1 & 10 & -1\\end{bmatrix}\\)", "\\(\\begin{bmatrix}8 & 1 & 2\\\\\\\\ 1 & 10 & 1\\end{bmatrix}\\)", "\\(\\begin{bmatrix}8 & 1 & 2\\\\\\\\ -1 & 10 & -1\\end{bmatrix}\\)"], c: 3, s: "\\(2(A+2B) - (2A+3B) = 4B - 3B = B\\). கழித்தால் விடை கிடைக்கும்."},
                {q: "17. \\(\\begin{bmatrix}4 & 3 & 2\\end{bmatrix} \\begin{bmatrix}1\\\\\\\\ -2\\\\\\\\ x\\end{bmatrix} = \\begin{bmatrix}6\\end{bmatrix}\\) எனில் x ன் மதிப்பு", o: ["4", "3", "2", "1"], c: 0, s: "\\(4(1) + 3(-2) + 2(x) = 6 \\Rightarrow 4-6+2x=6 \\Rightarrow 2x=8 \\Rightarrow x=4\\)"},
                {q: "18. P மற்றும் Q என்பன இரு அணிகள் எனில், கீழ்க்கண்டவற்றுள் சரியானது எது?", o: ["\\(PQ \\ne QP\\)", "\\((P^{T})^{T} \\ne P\\)", "\\(P+Q \\ne Q+P\\)", "எதுவுமில்லை"], c: 0, s: "அணிப் பெருக்கல் பொதுவாக பரிமாற்று விதிக்கு உட்பட்டதல்ல. எனவே \\(PQ \\ne QP\\)."},
                {q: "19. \\(A\\) வரிசை \\(3\\times2\\) மற்றும் \\(B\\) வரிசை \\(2\\times3\\) எனில், சாத்தியமானதை கூறுக.<br>(iii) AB (iv) BA", o: ["(i) மட்டும்", "(ii) மற்றும் (iii) மட்டும்", "(iii) மற்றும் (iv) மட்டும்", "மேற்கண்ட மூன்றும்"], c: 2, s: "AB மற்றும் BA இரண்டும் சாத்தியம்."},
                {q: "20. \\(A=\\begin{bmatrix}y & 0\\\\\\\\ 3 & 4\\end{bmatrix}\\) மற்றும் \\(A^{2}=16I\\) எனில் y-யின் மதிப்பு", o: ["y = 4", "y = 5", "y = 4", "y = -4"], c: 3, s: "\\(A^2\\) காணும் போது \\(3y+12=0 \\Rightarrow y=-4\\)."}
            ],
            "4": [
                {q: "1. முக்கோணங்கள் PQR மற்றும் LMN ஆகியவை வடிவொத்தவை. மேலும் \\(4PQ=LM\\) மற்றும் \\(QR=6\\) செ.மீ எனில், MN ஆனது", o: ["12 செ.மீ", "24 செ.மீ", "10 செ.மீ", "36 செ.மீ"], c: 1, s: "\\(\\frac{PQ}{LM} = \\frac{QR}{MN} \\Rightarrow \\frac{1}{4} = \\frac{6}{MN} \\Rightarrow MN = 24\\)"},
                {q: "2. \\(\\Delta ABC\\) யில் \\(DE \\parallel AC\\) எனில், கீழ்க்கண்டவற்றுள் எது உண்மை? (AD=a, DB=b, DE=x, AC=y)", o: ["\\(x=\\frac{ay}{b+a}\\)", "\\(x=\\frac{a+b}{ay}\\)", "\\(x=\\frac{ay}{b-a}\\)", "\\(\\frac{x}{y}=\\frac{a}{b}\\)"], c: 2, s: "வடிவொத்த முக்கோணங்கள் மூலம்: \\(x=\\frac{ay}{b-a}\\)."},
                {q: "3. \\(\\Delta PQR\\)-ல் பக்கங்கள் PQ மற்றும் PR-ன் மீது அமைந்துள்ள புள்ளிகள் முறையே S மற்றும் T ஆகும். \\(PS = 3, SQ = 6, PT = 5, TR = 10\\) எனில், QR-ன் மதிப்பு", o: ["4ST", "5ST", "3ST", "3QR"], c: 2, s: "\\(\\frac{PS}{PQ} = \\frac{3}{9} = \\frac{1}{3}\\). எனவே \\(QR = 3ST\\)."},
                {q: "4. \\(DE \\parallel BC\\). \\(BD=x-3\\), \\(BA=2x\\), \\(CE=x-2\\) மற்றும் \\(AC=2x+3\\) எனில், x-ன் மதிப்பு", o: ["3", "6", "9", "12"], c: 2, s: "தேல்ஸ் தேற்றப்படி: \\(\\frac{x+3}{x-3} = \\frac{x+5}{x-2} \\Rightarrow x=9\\)"},
                {q: "5. இரு வடிவொத்த முக்கோணங்களின் பரப்பளவுகளின் விகிதமானது கீழ்க்கண்டவற்றுள் எதற்குச் சமமாகும்?", o: ["அவற்றின் ஒத்த பக்கங்களின் விகிதத்திற்கு", "அவற்றின் ஒத்த பக்கங்களின் கணங்களின் விகிதத்திற்கு", "அவற்றின் ஒத்த குத்துயரங்களின் விகித்திற்கு", "அவற்றின் ஒத்த பக்கங்களின் வர்க்கங்களின் விகிதத்திற்கு"], c: 3, s: "பரப்பளவுகளின் விகிதம் = பக்கங்களின் வர்க்கங்களின் விகிதம்."},
                {q: "6. முக்கோணம் ABC -யில் \\(\\angle A\\)-யின் இருசமவெட்டி AD ஆகும். \\(AB=4, BD=6, DC=8\\) எனில், AC-யின் மதிப்பு", o: ["\\(\\frac{16}{3}\\) செ.மீ", "\\(\\frac{32}{3}\\) செ.மீ", "\\(\\frac{3}{16}\\) செ.மீ", "\\(\\frac{1}{2}\\) செ.மீ"], c: 0, s: "\\(\\frac{AB}{AC} = \\frac{BD}{DC} \\Rightarrow \\frac{4}{AC} = \\frac{6}{8} \\Rightarrow AC = \\frac{16}{3}\\)"},
                {q: "7. ஒரு முக்கோணத்தின், ஒரு கோணத்தின் உட்புற இருசமவெட்டியானது எதிர்பக்கத்தை இரு சமபாகங்களாகப் பிரிக்கிறது எனில், அம்முக்கோணமானது", o: ["செங்கோண முக்கோணம்", "சமபக்க முக்கோணம்", "அசமபக்க முக்கோணம்", "இருசமபக்க முக்கோணம்"], c: 3, s: "நடுக்கோடும் கோண இருசமவெட்டியும் ஒன்றாக அமைந்தால் அது இருசமபக்க முக்கோணம்."},
                {q: "8. 'a' அலகு பக்கமுடைய சமபக்க முக்கோணத்தின் உயரமானது", o: ["\\(\\frac{a}{2}\\)", "\\(\\sqrt{3}a\\)", "\\(\\frac{\\sqrt{3}}{2}a\\)", "\\(\\frac{\\sqrt{3}}{4}a\\)"], c: 2, s: "சமபக்க முக்கோணத்தின் உயரம் = \\(\\frac{\\sqrt{3}}{2}a\\). "},
                {q: "9. ஒரு செங்கோண முக்கோணத்தின் சுற்றளவு 40 செ.மீ மற்றும் அதன் கர்ணம் 15 செ.மீ எனில், அம்முக்கோணத்தின் பரப்பளவு", o: ["100 ச.செ.மீ", "200 ச.செ.மீ", "160 ச.செ.மீ", "225 ச.செ.மீ"], c: 0, s: "\\(a+b = 25\\) மற்றும் \\(a^2+b^2=225\\). பரப்பளவு = \\(\\frac{1}{2}ab = 100\\). "},
                {q: "10. ஒரு வட்டத்தினை இரு வெவ்வேறு புள்ளிகளில் வெட்டும் கோடானது", o: ["தொடுபுள்ளி", "வெட்டுக்கோடு", "விட்டம்", "தொடுகோடு"], c: 1, s: "இரு புள்ளிகளில் வெட்டும் கோடு வெட்டுக்கோடு (Secant) ஆகும்."},
                {q: "11. ஒரு வட்டத்தில் இரு ஆரங்களுக்கு இடைப்பட்ட கோணம் 130° ஆகும். ஆரங்களின் முடிவில் வரையப்பட்ட தொடுகோடுகளுக்கு இடைப்பட்ட கோணமானது", o: ["50°", "90°", "40°", "70°"], c: 0, s: "\\(180^\\circ - 130^\\circ = 50^\\circ\\)"},
                {q: "12. கொடுக்கப்பட்ட படத்தில் \\(\\angle OAB=60^{\\circ}\\) மற்றும் \\(OA=6\\) செ.மீ எனில், வட்டத்தின் ஆரமானது", o: ["\\(\\frac{3}{2}\\sqrt{3}\\)", "2 செ.மீ", "\\(3\\sqrt{3}\\)", "\\(2\\sqrt{3}\\)"], c: 2, s: "எதிர்ப்பக்கம் = கர்ணம் \\(\\times \\sin 60^\\circ = 6 \\times \\frac{\\sqrt{3}}{2} = 3\\sqrt{3}\\)"},
                {q: "13. \\(\\Delta OBC\\) யில் \\(OC = 9\\) செ.மீ மற்றும் \\(OB=15\\) செ.மீ எனில், \\(OB+BD\\) -யின் மதிப்பு", o: ["23", "24", "27", "30"], c: 2, s: "\\(BC = \\sqrt{15^2 - 9^2} = 12\\). \\(OB + BD = 15 + 12 = 27\\)"},
                {q: "14. இரண்டு பொது மைய வட்டங்களின் ஆரங்கள் a மற்றும் b ஆகும், இதில், \\(a > b\\). சிறிய வட்டத்தினை தொட்டுச் செல்லும் பெரிய வட்டத்தின் நாணின் நீளம்", o: ["\\(\\sqrt{a^{2}-b^{2}}\\)", "\\(2\\sqrt{a^{2}-b^{2}}\\)", "\\(\\sqrt{a^{2}+b^{2}}\\)", "\\(2\\sqrt{a^{2}+b^{2}}\\)"], c: 1, s: "நாணின் நீளம் = \\(2 \\times \\sqrt{a^2 - b^2}\\)"},
                {q: "15. 2, 3, 4 செ.மீ பக்கங்களைக் கொண்ட முக்கோணத்தின் முனைகளை மையமாகக் கொண்டு வட்டங்கள் வரையப்படுகின்றன. மிகச் சிறிய வட்டத்தின் விட்டமானது", o: ["1 செ.மீ", "3 செ.மீ", "5 செ.மீ", "4 செ.மீ"], c: 0, s: "ஆரங்கள்: \\(x+y=2, y+z=4, x+z=3\\). தீர்க்க: \\(x = 0.5\\). விட்டம் = 1 செ.மீ."},
            ],
            "5": [
                {q: "1. (-3, 10) மற்றும் (6,-8) ஆகிய புள்ளிகளை இணைக்கும் கோட்டுத்துண்டினை (-1,6) என்ற புள்ளி உட்புறமாக பிரிக்கும் விகிதம்", o: ["7:2", "3:4", "2:7", "5:3"], c: 2, s: "விடை: 2:7"},
                {q: "2. \\((a,b+c)\\), \\((b,c+a)\\) மற்றும் \\((c,a+b)\\) ஆகிய புள்ளிகளால் அமைக்கப்படும் முக்கோணத்தின் பரப்பு", o: ["\\(a+b+c\\)", "abc", "\\((a+b+c)^{2}\\)", "0"], c: 3, s: "விடை: 0"},
                {q: "3. (0,0), (a, 0) மற்றும் (0, b) என்ற புள்ளிகள் ஒரு கோடமைந்தவை எனில்,", o: ["\\(a=b\\)", "\\(a+b=0\\)", "\\(ab=0\\)", "\\(a\\ne b\\)"], c: 2, s: "விடை: \\(ab=0\\)"},
                {q: "4. \\(A(\\frac{x}{2},\\frac{y+1}{2})\\) மற்றும் \\(B(x+1,y-3)\\) ஆகிய புள்ளிகளை இணைக்கும் கோட்டுத் துண்டின் மையப்புள்ளி \\(C(5,-2)\\) எனில் x,y-யின் மதிப்பு", o: ["(6,-1)", "(-6,1)", "(-2,1)", "(3,5)"], c: 0, s: "விடை: (6,-1)"},
                {q: "5. (1,2), (-5,6), (7, -4) மற்றும் (k, -2) ஆகியவற்றை வரிசையான நான்கு முனைப் புள்ளிகளாக கொண்ட நாற்கரத்தின் பரப்பு பூஜ்ஜியம் எனில் k-யின் மதிப்பு", o: ["-4", "-2", "6", "3"], c: 3, s: "விடை: 3"},
                {q: "6. (5,3) என்ற புள்ளி வழிச் செல்லும் y அச்சுக்கு இணையான நேர் கோட்டின் சமன்பாடு", o: ["\\(y=5\\)", "\\(y=3\\)", "\\(x=5\\)", "\\(x=3\\)"], c: 2, s: "விடை: \\(x=5\\)"},
                {q: "7. \\(2y=x+8\\) என்ற நேர்கோட்டின் சாய்வானது", o: ["\\(\\frac{1}{2}\\)", "1", "8", "2"], c: 0, s: "விடை: \\(\\frac{1}{2}\\)"},
                {q: "8. கொடுக்கப்பட்ட கோடு \\(\\frac{y}{2}=x-p\\) ஆனது (-4,4) என்ற புள்ளி வழிச் சென்றால் p-யின் மதிப்பு", o: ["-4", "-6", "0", "8"], c: 1, s: "விடை: -6"},
                {q: "9. \\(3y-\\sqrt{3}x+1=0\\) என்ற நேர் கோட்டின் சாய்வு மற்றும் y-வெட்டுத்துண்டு", o: ["\\(\\frac{1}{\\sqrt{3}}, -\\frac{1}{3}\\)", "\\(-\\frac{1}{\\sqrt{3}}, -\\frac{1}{3}\\)", "\\(\\sqrt{3}, 1\\)", "\\(-\\sqrt{3}, 3\\)"], c: 0, s: "விடை: \\(\\frac{1}{\\sqrt{3}}, -\\frac{1}{3}\\)"},
                {q: "10. \\(y=5x-3\\), \\(y=2x+9\\) என்ற நேர்கோடுகள் A என்ற புள்ளியில் வெட்டிக் கொள்கின்றன எனில் A-யின் ஆயத்தொலைவு", o: ["(2,7)", "(2,3)", "(4, 17)", "(-4,23)"], c: 2, s: "விடை: (4, 17)"},
                {q: "11. \\(7y=ax+4\\) மற்றும் \\(2y=3-x\\) ஆகிய நேர்கோடுகள் இணை எனில் 'a'-ன் மதிப்பு", o: ["\\(\\frac{7}{2}\\)", "\\(-\\frac{2}{7}\\)", "\\(\\frac{2}{7}\\)", "\\(-\\frac{7}{2}\\)"], c: 3, s: "விடை: \\(-\\frac{7}{2}\\)"},
                {q: "12. (2,2) என்ற புள்ளி வழிச் செல்லும் கோடு மற்றும் ஆய அச்சுகள் சேர்ந்து \\(\\alpha\\) அளவுள்ள பரப்பை உருவாக்குகின்றன. ஆய அச்சுகளில் அக்கோடு ஏற்படுத்தும் வெட்டுத்துண்டுகளின் அளவானது பின்வரும் எந்த சமன்பாட்டின் மூலங்களாக அமையும்.", o: ["\\(x^{2}-2\\alpha x+\\alpha=0\\)", "\\(x^{2}+2\\alpha x+2\\alpha=0\\)", "\\(x^{2}-\\alpha x+2\\alpha=0\\)", "எதுவுமில்லை"], c: 2, s: "விடை: \\(x^{2}-\\alpha x+2\\alpha=0\\)"},
                {q: "13. (0,4) என்ற புள்ளி வழிச் செல்வதும் மற்றும் \\(3x+5y+15=0\\) என்ற கோட்டிற்கு இணையான நேர்க்கோட்டின் சமன்பாடு", o: ["\\(3x+5y+15=0\\)", "\\(3x+5y-20=0\\)", "\\(2x+7y-20=0\\)", "\\(4x+3y-15=0\\)"], c: 1, s: "விடை: \\(3x+5y-20=0\\)"},
                {q: "14. ஒரு செங்கோண முக்கோணம் ABC-யில், செங்கோண முனை B ஆகவும், BC-ஆனது x அச்சுக்கு இணையாகவும் உள்ளன எனில் AB-யின் சாய்வு", o: ["\\(\\sqrt{3}\\)", "\\(\\frac{1}{\\sqrt{3}}\\)", "1", "வரையறுக்கப்படவில்லை"], c: 3, s: "விடை: வரையறுக்கப்படவில்லை"},
                {q: "15. \\(3x-4y+8=0\\) என்ற நேர்கோட்டின் y-வெட்டுத்துண்டு", o: ["\\(-\\frac{8}{3}\\)", "\\(\\frac{3}{8}\\)", "2", "\\(\\frac{1}{2}\\)"], c: 2, s: "விடை: 2"}
            ],
            "6": [
                {q: "1. படத்தைப் பயன்படுத்தி \\(\\csc \\theta + \\cot \\theta\\) ன் மதிப்பு", o: ["\\(\\frac{a+b}{c}\\)", "\\(\\frac{c}{a+b}\\)", "\\(\\frac{b+c}{a}\\)", "\\(\\frac{b}{a+c}\\)"], c: 2, s: "விடை: \\(\\frac{b+c}{a}\\)"},
                {q: "2. \\((\\sec A + \\tan A)(1 - \\sin A)\\)", o: ["\\(\\sec A\\)", "\\(\\sin A\\)", "\\(\\csc A\\)", "\\(\\cos A\\)"], c: 3, s: "விடை: \\(\\cos A\\)"},
                {q: "3. \\(x = r \\sin \\theta \\cos \\phi\\), \\(y = r \\sin \\theta \\sin \\phi\\), \\(z = r \\cos \\theta\\) எனில் \\(x^2 + y^2 + z^2\\) என்பது", o: ["\\(r\\)", "\\(r^2\\)", "\\(\\frac{r^2}{2}\\)", "\\(2r^2\\)"], c: 1, s: "விடை: \\(r^2\\)"},
                {q: "4. \\(\\cos \\theta + \\cos^2 \\theta = 1\\) எனில், \\(\\sin^2 \\theta + \\sin^4 \\theta\\) ன் மதிப்பு", o: ["1", "0", "-1", "இவை எதுவுமில்லை"], c: 0, s: "விடை: 1"},
                {q: "5. \\(\\tan \\theta + \\cot \\theta = 3\\) எனில், \\(\\tan^2 \\theta + \\cot^2 \\theta\\) ன் மதிப்பு", o: ["4", "7", "6", "9"], c: 1, s: "விடை: 7"},
                {q: "6. \\(m \\cos \\theta + n \\sin \\theta = a\\) மற்றும் \\(m \\sin \\theta - n \\cos \\theta = b\\) எனில் \\(a^2 + b^2\\) என்பது", o: ["\\(m^2 - n^2\\)", "\\(m^2 + n^2\\)", "\\(m^2n^2\\)", "\\(n^2 - m^2\\)"], c: 1, s: "விடை: \\(m^2 + n^2\\)"},
                {q: "7. \\(\\frac{\\tan \\theta}{\\sec \\theta - 1} + \\frac{\\tan \\theta}{\\sec \\theta + 1}\\) ன் மதிப்பு", o: ["\\(2 \\tan \\theta\\)", "\\(2 \\sec \\theta\\)", "\\(2 \\csc \\theta\\)", "\\(2 \\tan \\theta \\sec \\theta\\)"], c: 2, s: "விடை: \\(2 \\csc \\theta\\)"},
                {q: "8. \\(\\frac{3}{\\cot^2 \\theta} - \\frac{3}{\\cos^2 \\theta}\\) ன் மதிப்பு", o: ["\\(\\frac{1}{3}\\)", "3", "0", "-3"], c: 3, s: "விடை: -3"},
                {q: "9. \\(\\sin(\\alpha + \\beta) = 1\\) எனில், \\(\\cos(\\alpha - \\beta)\\)", o: ["\\(\\sin \\alpha\\)", "\\(\\cos \\beta\\)", "\\(\\sin 2\\beta\\)", "\\(\\cos 2\\beta\\)"], c: 2, s: "விடை: \\(\\sin 2\\beta\\)"},
                {q: "10. \\(x = a \\sec \\theta\\) மற்றும் \\(y = b \\tan \\theta\\) எனில் \\(b^2x^2 - a^2y^2\\) என்பது", o: ["\\(ab\\)", "\\(a^2 - b^2\\)", "\\(a^2 + b^2\\)", "\\(a^2b^2\\)"], c: 3, s: "விடை: \\(a^2b^2\\)"},
                {q: "11. ஒரு மரத்தின் அடிப்புறத்திலிருந்து 250 மீ தொலைவில் உள்ள ஒரு புள்ளியிலிருந்து மர உச்சியின் ஏற்றக்கோணம் \\(60^\\circ\\) எனில் மரத்தின் உயரம்", o: ["250 மீ", "\\(250\\sqrt{3}\\) மீ", "\\(\\frac{250}{\\sqrt{3}}\\) மீ", "\\(200\\sqrt{3}\\) மீ"], c: 1, s: "விடை: \\(250\\sqrt{3}\\) மீ"},
                {q: "12. \\(50\\sqrt{3}\\) மீ உயரமுள்ள ஒரு பாலத்திலிருந்து ஒரு படகின் இறக்கக்கோணம் \\(30^\\circ\\) ஆகும். படகு மற்றும் பாலம் இவற்றுக்கு இடையேயான கிடைமட்டத் தொலைவு", o: ["150 மீ", "\\(150\\sqrt{3}\\) மீ", "60 மீ", "\\(60\\sqrt{3}\\) மீ"], c: 0, s: "விடை: 150 மீ"},
                {q: "13. 14 மீ உயரமுள்ள ஓர் ஏணி சுவரின் உச்சியைத் தொடுகிறது. தரையுடன் ஏணி \\(60^\\circ\\) கோணத்தை ஏற்படுத்தினால் சுவரின் உயரம்", o: ["\\(14\\sqrt{3}\\) மீ", "\\(28\\sqrt{3}\\) மீ", "\\(7\\sqrt{3}\\) மீ", "\\(35\\sqrt{3}\\) மீ"], c: 2, s: "விடை: \\(7\\sqrt{3}\\) மீ"},
                {q: "14. 18.5 மீ மற்றும் 7 மீ உயரமுள்ள இரு கம்பங்களின் உச்சிகள் ஒரு கம்பியில் இணைக்கப்பட்டுள்ளன. கிடைமட்டக்கோட்டோடு கம்பி \\(30^\\circ\\) கோணத்தை ஏற்படுத்தினால் கம்பியின் நீளம்", o: ["23 மீ", "18 மீ", "28 மீ", "25.5 மீ"], c: 0, s: "விடை: 23 மீ"},
                {q: "15. ஓர் ஆற்றின் இரு கரைகளும் இணையாக உள்ளன... நீந்திச் சென்ற தொலைவு 20 மீ, எனில் ஆற்றின் அகலம் \\((\\sqrt{2}=1.414)\\)", o: ["12.12 மீ", "14.14 மீ", "16.16 மீ", "18.18 மீ"], c: 1, s: "விடை: 14.14 மீ"}
            ],
            "7": [
                {q: "1. 15 செ.மீ உயரமும் 16 செ.மீ அடிப்புற விட்டமும் உடைய ஒரு நேர்வட்ட கூம்பின் வளைபரப்பு", o: ["\\(60\\pi\\) ச.செ.மீ", "\\(68\\pi\\) ச.செ.மீ", "\\(120\\pi\\) ச.செ.மீ", "\\(136\\pi\\) ச.செ.மீ"], c: 3, s: "விடை: \\(136\\pi\\) ச.செ.மீ"},
                {q: "2. r ஆரம் கொண்ட ஒரு கோளத்தின் மொத்தப்பரப்பு \\(S_1\\) மற்றும் r ஆரமும் 2r உயரமும் உடைய ஓர் உருளையின் மொத்தப்பரப்பு \\(S_2\\) எனில்,", o: ["\\(S_1 = S_2\\)", "\\(S_1 > S_2\\)", "\\(S_1 < S_2\\)", "\\(S_1 = 2S_2\\)"], c: 2, s: "விடை: \\(S_1 < S_2\\)"},
                {q: "3. கன அளவு மாறாதவாறு ஒரு கம்பியின் ஆரமானது மூன்றில் ஒரு பங்காக குறைக்கப்பட்டால், புதிய கம்பியின் நீளம் முந்தைய கம்பியின் நீளத்தைப் போல் எத்தனை மடங்கு இருக்கும்?", o: ["3 மடங்கு", "6 மடங்கு", "9 மடங்கு", "27 மடங்கு"], c: 2, s: "விடை: 9 மடங்கு"},
                {q: "4. இரு கோளங்களின் கன அளவுகளின் விகிதம் 8:27. \\((R-r)\\) மற்றும் r என்பன முறையே கோளங்களின் ஆரங்கள் எனில், \\((R-r) : r\\) என்பது", o: ["1:2", "1:3", "2:3", "4:9"], c: 2, s: "விடை: 2:3"},
                {q: "5. ஒரு கூம்பின் உயரம் 60 செ.மீ ஆகும்... சிறிய கூம்பின் கன அளவு முந்தைய கூம்பின் கன அளவில் \\(\\frac{1}{64}\\) பங்காகும் எனில், சிறிய கூம்பின் உயரம்", o: ["45 செ.மீ", "30 செ.மீ", "15 செ.மீ", "20 செ.மீ"], c: 2, s: "விடை: 15 செ.மீ"},
                {q: "6. ஒரு திண்ம இடைக்கண்டத்தின் உயரம் 8 செ.மீ ஆகும். அதன் கீழ்ப்புற மற்றும் மேற்புற ஆரங்கள் முறையே 3 செ.மீ மற்றும் 9 செ.மீ எனில், இடைக்கண்டத்தின் சாயுயரம்", o: ["15 செ.மீ", "12 செ.மீ", "10 செ.மீ", "17 செ.மீ"], c: 2, s: "விடை: 10 செ.மீ"},
                {q: "7. ஒரு திண்மத்தின் அடிப்புறம் அரைக்கோள வடிவிலும் மேற்புறம் கூம்பு வடிவிலும் உள்ளது. இரு பகுதிகளின் வளைப்பரப்புகள் சமம் எனில், கூம்பு வடிவத்தின் ஆரம் மற்றும் உயரம் ஆகியவற்றின் விகிதம்", o: ["1:3", "\\(1:\\sqrt{3}\\)", "1:1", "\\(\\sqrt{3}:1\\)"], c: 1, s: "விடை: \\(1:\\sqrt{3}\\)"},
                {q: "8. ஒரு திண்மக் கூம்பு, அதன் ஆரத்திற்கு சம அளவு ஆரமுள்ள ஓர் உருளையாக மாற்றப்படுகிறது. உருளையின் உயரம் 5 செ.மீ எனில் கூம்பின் உயரம்", o: ["10 செ.மீ", "15 செ.மீ", "18 செ.மீ", "24 செ.மீ"], c: 1, s: "விடை: 15 செ.மீ"},
                {q: "9. ஓர் உருளையின் வளைபரப்பு 264 ச.மீ மற்றும் கன அளவு 924 க.மீ எனில், அதன் விட்டம் மற்றும் உயரத்தின் விகிதம்", o: ["3:7", "7:3", "6:7", "7:6"], c: 1, s: "விடை: 7:3"},
                {q: "10. ஒரு கோளத்தின் மேற்பரப்பை அதன் கன அளவால் வகுக்கும் போது \\(\\frac{1}{3}\\) என்ற விடை கிடைக்கிறது எனில், கோளத்தின் ஆரம் என்ன?", o: ["24 மீ", "9 மீ", "54 மீ", "4.5 மீ"], c: 1, s: "விடை: 9 மீ"},
                {q: "11. ஒரு கோள வடிவிலான பெரிய இரும்புக் குண்டு உருக்கப்பட்டு, ஒரே மாதிரியான 8 சிறிய குண்டுகளாக்கப்படுகிறது. சிறிய இரும்புக் குண்டின் ஆரம் பெரிய இரும்புக் குண்டின் ஆரத்தைப் போல _____ மடங்கு இருக்கும்.", o: ["\\(\\frac{1}{3}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{1}{8}\\)"], c: 2, s: "விடை: \\(\\frac{1}{2}\\)"},
                {q: "12. 28 செ.மீ விட்டமுடைய அரைவட்ட வடிவிலான ஒரு மெல்லிய உலோகத் தகடு ஒரு திறந்த கூம்பாக மாற்றப்படுகிறது. அதன் கொள்ளளவு என்ன?", o: ["\\((\\frac{1000}{3})\\sqrt{3}\\) க.செ.மீ", "\\(300\\sqrt{3}\\) க.செ.மீ", "\\((\\frac{700}{3})\\sqrt{3}\\) க.செ.மீ", "\\((\\frac{1078}{3})\\sqrt{3}\\) க.செ.மீ"], c: 3, s: "விடை: \\((\\frac{1078}{3})\\sqrt{3}\\) க.செ.மீ"},
                {q: "13. 9 செ.மீ ஆரமுள்ள ஒரு திண்ம மரக்கோளத்திலிருந்து 18 செ.மீ அடிப்புற விட்டமும் 9 செ.மீ உயரமும் கொண்ட ஒரு கூம்பு செதுக்கி எடுக்கப்படுகிறது. மீதமுள்ள மரத்தின் சதவீதம்", o: ["45%", "56%", "67%", "75%"], c: 3, s: "விடை: 75%"},
                {q: "14. 1 மீ ஆரம் மற்றும் 5 மீ உயரம் கொண்ட உருளை ஒன்றில் பால் முழுமையாக நிரம்பியுள்ளது. 50 செ.மீ உயரமும், ஆரமும் உடைய எத்தனை கூம்பு வடிவ குடுவைகளில் உருளையில் உள்ள பாலை முழுமையாக நிரப்ப முடியும்?", o: ["50", "500", "120", "160"], c: 2, s: "விடை: 120"},
                {q: "15. 3 மீ நீளமும் 2 மீ அகலமும் உடைய ஒரு படகு ஏரியில் மிதக்கிறது... 1 செ.மீ நீரினுள் மூழ்குகிறது எனில் அந்த நபரின் எடை", o: ["50 கி.கி", "60 கி.கி", "70 கி.கி", "80 கி.கி"], c: 1, s: "விடை: 60 கி.கி"}
            ],
            "8": [
                {q: "1. முதல் பத்து பகா எண்களின் வீச்சு", o: ["9", "20", "27", "5"], c: 2, s: "விடை: 27"},
                {q: "2. ஒரு தரவின் மிகச் சிறிய மதிப்பு மற்றும் வீச்சுக்கெழு ஆகியவை முறையே 25 மற்றும் 0.5 எனில் மிகப் பெரிய மதிப்பு", o: ["25", "75", "100", "12.5"], c: 1, s: "விடை: 75"},
                {q: "3. ஒரு தரவின் விலக்க வர்க்கச் சராசரி மற்றும் திட்ட விலக்கமானது முறையே 35% மற்றும் 7.7 எனில், அதன் சராசரியானது", o: ["20", "30", "25", "22"], c: 3, s: "விடை: 22"},
                {q: "4. 1, 2, 3,...50 என்ற உற்று நோக்கல்களின் விலக்க வர்க்க சராசரி \\(V_1\\) மற்றும் 51, 52,... 100 என்ற உற்று நோக்கல்களின் விலக்க வர்க்க சராசரி \\(V_2\\) எனில் \\(\\frac{V_1}{V_2}\\) ஆனது", o: ["2", "1", "\\(\\frac{1}{2}\\)", "0"], c: 1, s: "விடை: 1"},
                {q: "5. x என்ற மாறியின் திட்டவிலக்கமானது 4 மற்றும் \\(y = \\frac{3x+5}{4}\\) எனில், y-ன் திட்டவிலக்கமானது", o: ["4", "3.5", "3", "2.5"], c: 2, s: "விடை: 3"},
                {q: "6. ஒரு தரவை 4 ஆல் பெருக்கினால், அதற்கு ஒத்த விலக்க வர்க்க சராசரி பெருக்கப்படும் எண்ணானது", o: ["4", "16", "2", "இல்லை"], c: 1, s: "விடை: 16"},
                {q: "7. மட்டைப் பந்தாளர் A ஆனவர், மட்டை பந்தாளர் B ஐ விட அதிக நிலைப்புத்தன்மை உடையவர் எனில்,", o: ["A ன் மாறுபாட்டு கெழு > B ன் மாறுபாட்டு கெழு", "A ன் மாறுபாட்டு கெழு < B ன் மாறுபாட்டு கெழு", "A ன் மாறுபாட்டு கெழு = B ன் மாறுபாட்டு கெழு", "A ன் மாறுபாட்டு கெழு \\(\\ge\\) B ன் மாறுபாட்டு கெழு"], c: 1, s: "விடை: A ன் மாறுபாட்டு கெழு < B ன் மாறுபாட்டு கெழு"},
                {q: "8. -4, -3, -2, -1, 0, 1, 2, 3, 4 லிருந்து ஓர் எண் x ஆனது சமவாய்ப்பு முறையில் எடுக்கப்படுகிறது \\(|x| \\le 3\\) ஆக இருப்பதற்கான நிகழ்தகவு", o: ["\\(\\frac{3}{9}\\)", "\\(\\frac{4}{9}\\)", "\\(\\frac{2}{9}\\)", "\\(\\frac{7}{9}\\)"], c: 3, s: "விடை: \\(\\frac{7}{9}\\)"},
                {q: "9. பால் சாக்லேட்டுகள் மற்றும் கோகோ சாக்லேட்டுகள் என ஒரு பெட்டியில் 60 சாக்லேட்டுகள் உள்ளன. ஒரு பால் சாக்லேட்டு எடுப்பதற்கான நிகழ்தகவு \\(\\frac{2}{3}\\) எனில், கோகோ சாக்லேட்டுகளின் எண்ணிக்கையானது", o: ["40", "50", "20", "30"], c: 2, s: "விடை: 20"},
                {q: "10. ஒரு நிகழ்ச்சி நிகழாமல் இருப்பதற்கான நிகழ்தகவு q எனில், அந்த நிகழ்ச்சி நிகழ்வதற்கான நிகழ்தகவு", o: ["\\(1 - q\\)", "q", "\\(\\frac{q}{2}\\)", "2q"], c: 0, s: "விடை: \\(1 - q\\)"},

    let currentLang = 'ta';

    function startQuiz(lang) {
        currentLang = lang;
        document.getElementById('landing-page').style.display = 'none';
        document.getElementById('quiz-page').style.display = 'block';
        
        if(lang === 'ta') {
            document.body.style.backgroundColor = 'var(--light-brown-theme)';
            document.documentElement.style.setProperty('--bg-color', 'var(--light-brown-theme)');
        } else {
            document.body.style.backgroundColor = 'var(--sky-blue-theme)';
            document.documentElement.style.setProperty('--bg-color', 'var(--sky-blue-theme)');
        }

        populateDropdown();
        loadChapter();
    }

    function goBack() {
        document.getElementById('quiz-page').style.display = 'none';
        document.getElementById('landing-page').style.display = 'block';
        document.body.style.backgroundColor = '#fdfbf7';
    }

    function populateDropdown() {
        const select = document.getElementById('chapterSelect');
        select.innerHTML = '';
        chapterNames[currentLang].forEach((name, index) => {
            let opt = document.createElement('option');
            opt.value = index + 1;
            opt.innerHTML = name;
            select.appendChild(opt);
        });
    }

    function loadChapter() {
        const chapterId = document.getElementById('chapterSelect').value;
        document.getElementById('chapter-title-display').innerText = chapterNames[currentLang][chapterId - 1];
        
        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        const questions = quizData[currentLang][chapterId];
        
        if (!questions) return;

        questions.forEach((q, qIndex) => {
            const card = document.createElement('div');
            card.className = 'question-card';
            let optionsHtml = '';
            q.o.forEach((optText, optIndex) => {
                optionsHtml += `
                    <li>
                        <label id="label-${qIndex}-${optIndex}">
                            <input type="radio" name="q${qIndex}" value="${optIndex}" 
                                   onchange="evaluateAnswer(${qIndex}, ${optIndex}, ${q.c})">
                            ${optText}
                            <span id="icon-${qIndex}-${optIndex}" class="status-icon"></span>
                        </label>
                    </li>
                `;
            });
            card.innerHTML = `
                <div class="question-text">${q.q}</div>
                <ul class="options">${optionsHtml}</ul>
                <div class="solution" id="solution-${qIndex}"><strong>தீர்வு / Solution:</strong><br>${q.s}</div>
            `;
            container.appendChild(card);
        });

        MathJax.typesetPromise();
    }

    function evaluateAnswer(qIndex, selectedOptIndex, correctOptIndex) {
        document.getElementsByName(`q${qIndex}`).forEach(radio => radio.disabled = true);
        const selectedLabel = document.getElementById(`label-${qIndex}-${selectedOptIndex}`);
        const correctLabel = document.getElementById(`label-${qIndex}-${correctOptIndex}`);
        const selectedIcon = document.getElementById(`icon-${qIndex}-${selectedOptIndex}`);
        const correctIcon = document.getElementById(`icon-${qIndex}-${correctOptIndex}`);

        if (selectedOptIndex === correctOptIndex) {
            selectedLabel.classList.add('correct-answer');
            selectedIcon.innerHTML = '✅';
        } else {
            selectedLabel.classList.add('wrong-answer');
            selectedIcon.innerHTML = '❌';
            correctLabel.classList.add('correct-answer');
            correctIcon.innerHTML = '✅';
        }
        document.getElementById(`solution-${qIndex}`).style.display = 'block';
    }
