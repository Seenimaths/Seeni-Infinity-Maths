    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const dateObj = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('live-date').innerHTML = `<i class="fa-regular fa-calendar-days"></i> இன்றைய தேதி: ${dateObj.toLocaleDateString('ta-IN', options)}`;
        });

        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        function playSound(isCorrect) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            if (isCorrect) {
                // 8-Bit Magic Sparkle Sound
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                osc.type = 'square'; 
                osc.frequency.setValueAtTime(1046.50, now);        
                osc.frequency.setValueAtTime(1318.51, now + 0.08); 
                osc.frequency.setValueAtTime(1567.98, now + 0.16); 
                osc.frequency.setValueAtTime(2093.00, now + 0.24); 
                
                gainNode.gain.setValueAtTime(0, now);
                gainNode.gain.linearRampToValueAtTime(0.15, now + 0.05);
                gainNode.gain.setValueAtTime(0.15, now + 0.24);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                
                osc.start(now); osc.stop(now + 0.5);
            } else {
                // Wrong Buzz Sound
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.3);
                
                gainNode.gain.setValueAtTime(0.3, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                
                osc.start(now); osc.stop(now + 0.4);
            }
        }

        // FULL 125 QUESTIONS DATABASE WITH TAMIL EXPLANATIONS
        // FULL 125 QUESTIONS DATABASE WITH TAMIL EXPLANATIONS (CHAPTER 1 TO 8)
        const quizDatabase = {
            "1": [
                { q: "$n(A\\times B)=6$ மற்றும் $A=\\{1,3\\}$, எனில் $n(B)$ ஆனது", opts: ["1", "2", "3", "6"], ans: "3", exp: "கொடுக்கப்பட்டவை: $n(A\\times B) = 6$ மற்றும் $A = \\{1,3\\}$. எனவே $n(A) = 2$. <br>சூத்திரம்: $n(A\\times B) = n(A) \\times n(B)$. <br> $6 = 2 \\times n(B) \\implies n(B) = \\frac{6}{2} = 3$." },
                { q: "$A=\\{a,b,p\\}$, $B=\\{2,3\\}$, $C=\\{p,q,r,s\\}$ எனில் $n[(A\\cup C)\\times B]$ ஆனது", opts: ["8", "20", "12", "16"], ans: "12", exp: "முதலில் $A \\cup C$-ஐக் காண்க. <br>$A \\cup C = \\{a,b,p\\} \\cup \\{p,q,r,s\\} = \\{a,b,p,q,r,s\\}$. எனவே, $n(A \\cup C) = 6$. <br>$B = \\{2,3\\}$ என்பதால் $n(B) = 2$. <br>$n[(A \\cup C) \\times B] = n(A \\cup C) \\times n(B) = 6 \\times 2 = 12$." },
                { q: "$A=\\{1,2\\}$, $B=\\{1,2,3,4\\}$, $C=\\{5,6\\}$ மற்றும் $D=\\{5,6,7,8\\}$ எனில் கீழே கொடுக்கப்பட்டவைகளில் எது சரியான கூற்று?", opts: ["$(A\\times C)\\subset(B\\times D)$", "$(B\\times D)\\subset(A\\times C)$", "$(A\\times B)\\subset(A\\times D)$", "$(D\\times A)\\subset(B\\times A)$"], ans: "$(A\\times C)\\subset(B\\times D)$", exp: "$A = \\{1,2\\}$ ஆனது $B = \\{1,2,3,4\\}$-ன் உட்கணம் ($A \\subset B$). <br>அதேபோல் $C = \\{5,6\\}$ ஆனது $D = \\{5,6,7,8\\}$-ன் உட்கணம் ($C \\subset D$). <br>எனவே குறுக்கு பெருக்கலின் பண்பின்படி $(A \\times C) \\subset (B \\times D)$ என்பது சரி." },
                { q: "$A=\\{1,2,3,4,5\\}$-லிருந்து, B என்ற கணத்திற்கு 1024 உறவுகள் உள்ளது எனில் B-ல் உள்ள உறுப்புகளின் எண்ணிக்கை", opts: ["3", "2", "4", "8"], ans: "2", exp: "இங்கு $n(A) = 5$. $n(B) = k$ என்க. <br>உறவுகளின் எண்ணிக்கை = $2^{n(A) \\times n(B)}$.<br>கொடுக்கப்பட்டுள்ளது: $2^{5 \\times k} = 1024$. <br>$1024$ ஐ $2^{10}$ என எழுதலாம். <br>எனவே $2^{5k} = 2^{10} \\implies 5k = 10 \\implies k = 2$." },
                { q: "$\\mathbb{R}=\\{(x,x^2)|x$ ஆனது 13-ஐ விடக் குறைவான பகா எண்கள்$\\}$ என்ற உறவின் வீச்சகமானது", opts: ["$\\{2,3,5,7\\}$", "$\\{4,9,25,49,121\\}$", "$\\{2,3,5,7,11\\}$", "$\\{1,4,9,25,49,121\\}$"], ans: "$\\{4,9,25,49,121\\}$", exp: "13-ஐ விடக் குறைவான பகா எண்கள்: $x = \\{2, 3, 5, 7, 11\\}$. <br>வீச்சகம் (Range) என்பது $x^2$-ன் மதிப்புகள் ஆகும். <br>$2^2=4$, $3^2=9$, $5^2=25$, $7^2=49$, $11^2=121$. <br>வீச்சகம் = $\\{4, 9, 25, 49, 121\\}$." },
                { q: "$(a+2,4)$ மற்றும் $(5,2a+b)$ ஆகிய வரிசைச் சோடிகள் சமம் எனில், $(a,b)$ என்பது", opts: ["$(2,-2)$", "$(5,1)$", "$(2,3)$", "$(3,-2)$"], ans: "$(3,-2)$", exp: "ஒத்த ஆயத்தொலைகளைச் சமன்படுத்த: <br>1) $a + 2 = 5 \\implies a = 3$<br>2) $2a + b = 4$<br>$a=3$ எனப் பிரதியிட: $2(3) + b = 4 \\implies 6 + b = 4 \\implies b = -2$. <br>எனவே, $(a, b) = (3, -2)$." },
                { q: "$n(A)=m$ மற்றும் $n(B)=n$ என்க. A-லிருந்து B-க்கு வரையறுக்கப்பட்ட வெற்று கணமில்லாத உறவுகளின் மொத்த எண்ணிக்கை.", opts: ["$m^n$", "$n^m$", "$2^{mn}-1$", "$2^{mn}$"], ans: "$2^{mn}-1$", exp: "உறவுகளின் மொத்த எண்ணிக்கை $2^{n(A) \\times n(B)} = 2^{mn}$.<br>இதில் வெற்று கணமில்லாத (Non-empty) உறவுகள் வேண்டும் என்பதால், 1 வெற்று கணத்தைக் கழிக்க வேண்டும்.<br>விடை: $2^{mn} - 1$." },
                { q: "$\\{(a, 8), (6,b)\\}$ ஆனது ஒரு சமனிச் சார்பு எனில், a மற்றும் b மதிப்புகளாவன முறையே", opts: ["$(8,6)$", "$(8,8)$", "$(6,8)$", "$(6,6)$"], ans: "$(8,6)$", exp: "ஒரு சமனிச் சார்பு (Identity Function) $f(x) = x$ ஆனது உறுப்புகளை அதே உறுப்புகளுடன் இணைக்கும். அதாவது $(x, x)$ வடிவத்தில் இருக்கும்.<br>எனவே, $(a, 8) \\implies a = 8$.<br>$(6, b) \\implies b = 6$.<br>மதிப்புகள் $(8, 6)$." },
                { q: "$A=\\{1,2,3,4\\}$; $B=\\{4,8,9,10\\}$ என்க. $f: A\\rightarrow B$ ஆனது $f=\\{(1,4), (2,8), (3,9), (4,10)\\}$ எனக் கொடுக்கப்பட்டால் f-என்பது", opts: ["பலவற்றிலிருந்து ஒன்றுக்கான சார்பு", "சமனிச் சார்பு", "ஒன்றுக்கொன்றான சார்பு", "உட்சார்பு"], ans: "ஒன்றுக்கொன்றான சார்பு", exp: "$f=\\{(1,4), (2,8), (3,9), (4,10)\\}$ என்பதில், A-யின் வெவ்வேறு உறுப்புகளுக்கு B-ல் வெவ்வேறு நிழல் உருக்கள் உள்ளன. எனவே இது **ஒன்றுக்கொன்றான சார்பு** ஆகும்." },
                { q: "$f(x)=2x^2$ மற்றும் $g(x)=\\frac{1}{3x}$, எனில் $f\\circ g$ ஆனது", opts: ["$\\frac{3}{2x^2}$", "$\\frac{2}{3x^2}$", "$\\frac{2}{9x^2}$", "$\\frac{1}{6x^2}$"], ans: "$\\frac{2}{9x^2}$", exp: "$f \\circ g = f(g(x)) = f\\left(\\frac{1}{3x}\\right)$. <br> $f(x) = 2x^2$ என்பதில் $x$-க்கு பதில் $\\frac{1}{3x}$ எனப் பிரதியிட: <br> $= 2 \\left(\\frac{1}{3x}\\right)^2 = 2 \\left(\\frac{1}{9x^2}\\right) = \\frac{2}{9x^2}$." },
                { q: "$f:A\\rightarrow B$ ஆனது இருபுறச் சார்பு மற்றும் $n(B)=7$ எனில் $n(A)$ ஆனது", opts: ["7", "49", "1", "14"], ans: "7", exp: "ஒரு சார்பானது இருபுறச் சார்பாக (Bijective) இருக்க வேண்டும் எனில், இரண்டு கணங்களிலும் உள்ள உறுப்புகளின் எண்ணிக்கை சமமாக இருக்க வேண்டும்.<br>எனவே, $n(A) = n(B) = 7$." },
                { q: "f மற்றும் g என்ற இரண்டு சார்புகளும் $f=\\{(0,1), (2,0), (3, 4), (4,2), (5,7)\\}$; $g=\\{(0,2), (1,0), (2,4), (-4,2), (7,0)\\}$ எனக் கொடுக்கப்பட்டால் $f\\circ g$-ன் வீச்சகமானது", opts: ["$\\{0,2,3,4,5\\}$", "$\\{-4,1,0,2,7\\}$", "$\\{1,2,3,4,5\\}$", "$\\{0,1,2\\}$"], ans: "$\\{0,1,2\\}$", exp: "$f(g(x))$-ஐக் கண்டுபிடிக்க: <br>$g(0)=2 \\implies f(2)=0$ <br>$g(1)=0 \\implies f(0)=1$ <br>$g(2)=4 \\implies f(4)=2$ <br>$g(-4)=2 \\implies f(2)=0$ <br>$g(7)=0 \\implies f(0)=1$ <br>இதன் வீச்சகம் (Outputs) = $\\{0, 1, 2\\}$." },
                { q: "$f(x)=\\sqrt{1+x^2}$ எனில்", opts: ["$f(xy)=f(x)\\cdot f(y)$", "$f(xy)\\ge f(x)\\cdot f(y)$", "$f(xy)\\le f(x)\\cdot f(y)$", "இவற்றில் ஒன்றுமில்லை"], ans: "$f(xy)\\le f(x)\\cdot f(y)$", exp: "$f(x)f(y) = \\sqrt{1+x^2} \\cdot \\sqrt{1+y^2} = \\sqrt{(1+x^2)(1+y^2)} = \\sqrt{1+x^2+y^2+x^2y^2}$.<br>ஆனால் $f(xy) = \\sqrt{1+(xy)^2} = \\sqrt{1+x^2y^2}$.<br>இங்கு $x^2+y^2 \\ge 0$ என்பதால், $\\sqrt{1+x^2y^2} \\le \\sqrt{1+x^2+y^2+x^2y^2}$.<br>எனவே, $f(xy) \\le f(x)f(y)$." },
                { q: "$g=\\{(1,1), (2,3), (3,5), (4,7)\\}$ என்ற சார்பானது $g(x)=\\alpha x+\\beta$ எனக் கொடுக்கப்பட்டால் $\\alpha$ மற்றும் $\\beta$-வின் மதிப்பானது", opts: ["$(-1,2)$", "$(2,-1)$", "$(-1,-2)$", "$(1,2)$"], ans: "$(2,-1)$", exp: "$g(1)=1 \\implies \\alpha(1) + \\beta = 1 \\implies \\alpha + \\beta = 1$ (சமன்பாடு 1).<br>$g(2)=3 \\implies \\alpha(2) + \\beta = 3 \\implies 2\\alpha + \\beta = 3$ (சமன்பாடு 2).<br>சமன் 2 இலிருந்து சமன் 1 ஐக் கழிக்க: $\\alpha = 2$.<br>இதை சமன் 1-ல் பிரதியிட: $2 + \\beta = 1 \\implies \\beta = -1$.<br>எனவே $(2, -1)$." },
                { q: "$f(x)=(x+1)^3-(x-1)^3$ குறிப்பிடும் சார்பானது", opts: ["நேரிய சார்பு", "ஒரு கனச் சார்பு", "தலைகீழ்ச் சார்பு", "இருபடிச் சார்பு"], ans: "இருபடிச் சார்பு", exp: "$(a+b)^3$ மற்றும் $(a-b)^3$ சூத்திரத்தைப் பயன்படுத்தி விரிவாக்குக:<br>$f(x) = (x^3+3x^2+3x+1) - (x^3-3x^2+3x-1)$<br>$f(x) = x^3+3x^2+3x+1 - x^3+3x^2-3x+1$<br>$f(x) = 6x^2 + 2$.<br>இங்கு அதிகபட்ச அடுக்கு 2 என்பதால், இது ஒரு **இருபடிச் சார்பு** ஆகும்." }
            ],
            "2": [
                { q: "யூக்ளிடின் வகுத்தல் துணைத் தேற்றத்தின் படி, a மற்றும் b என்ற மிகை முழுக்களுக்கு, தனித்த மிகை முழுக்கள் q மற்றும் r; $a=bq+r$ என்றவாறு அமையுமானால், இங்கு r ஆனது,", opts: ["$1 \\lt r \\lt b$","$0 \\lt r \\lt b$","$0 \\le r \\lt b$","$0 \\lt r \\le b$" ], ans: "$0 \\le r \\lt b$", exp: "யூக்ளிடின் வகுத்தல் துணைத் தேற்றத்தின்படி, எந்தவொரு மிகை முழுக்கள் $a$ மற்றும் $b$-க்கும், $a = bq + r$ என்றவாறு அமையக்கூடிய மீதி (r) ஆனது எப்பொழுதும் $0 \\le r < b$ என்ற நிபந்தனையை நிறைவு செய்யும்." },
                { q: "யூக்ளிடின் வகுத்தல் துணைத் தேற்றத்தைப் பயன்படுத்தி, எந்த மிகை முழுவின் கனத்தையும் 9ஆல் வகுக்கும் போது கிடைக்கும் மீதிகள்", opts: ["0, 1, 8", "1, 4, 8", "0, 1, 3", "1, 3, 5"], ans: "0, 1, 8", exp: "எந்தவொரு மிகை முழுவும் $3q, 3q+1, 3q+2$ என்ற வடிவில் அமையும். இவற்றை கனம் செய்யும்போது (Cube):<br>$(3q)^3 = 27q^3 = 9(3q^3) \\implies$ மீதி 0.<br>$(3q+1)^3 = 27q^3+27q^2+9q+1 = 9(3q^3+3q^2+q)+1 \\implies$ மீதி 1.<br>$(3q+2)^3 = 27q^3+54q^2+36q+8 = 9(k)+8 \\implies$ மீதி 8.<br>எனவே மீதிகள்: 0, 1, 8." },
                { q: "65 மற்றும் 117-யின் மீ.பொ.வ-வை $65m-117$ என்ற வடிவில் எழுதும்போது, m-யின் மதிப்பு", opts: ["4", "2", "1", "3"], ans: "2", exp: "மீ.பொ.வ(65, 117)-ஐக் காண்க.<br>$117 = 65 \\times 1 + 52$<br>$65 = 52 \\times 1 + 13$<br>$52 = 13 \\times 4 + 0$. எனவே மீ.பொ.வ = 13.<br>கொடுக்கப்பட்டுள்ளது: $65m - 117 = 13 \\implies 65m = 130 \\implies m = 2$." },
                { q: "1729-ஐ பகாக் காரணிப்படுத்தும் போது, அந்தப் பகா எண்களின் அடுக்குகளின் கூடுதல்", opts: ["1", "2", "3", "4"], ans: "3", exp: "1729 ஐ பகா காரணிப்படுத்தினால் (Prime Factorization): <br> $1729 = 7 \\times 247 = 7 \\times 13 \\times 19$ <br> $= 7^1 \\times 13^1 \\times 19^1$. <br> அடுக்குகளின் கூடுதல் = $1 + 1 + 1 = 3$." },
                { q: "1 முதல் 10 வரையுள்ள (இரண்டு எண்களும் உட்பட) அனைத்து எண்களாலும் வகுபடும் மிகச்சிறிய எண்", opts: ["2025", "5220", "5025", "2520"], ans: "2520", exp: "1 முதல் 10 வரையிலான எண்களின் மீ.சி.ம (LCM) காண வேண்டும்.<br>பகா காரணிகள்: $8 = 2^3$, $9 = 3^2$, $5 = 5^1$, $7 = 7^1$.<br>மீ.சி.ம = $2^3 \\times 3^2 \\times 5 \\times 7 = 8 \\times 9 \\times 5 \\times 7 = 2520$." },
                { q: "$7^{4k}\\equiv$ ____ $\\pmod{100}$", opts: ["1", "2", "3", "4"], ans: "1", exp: "$7$-ன் அடுக்குகளைக் காண்க:<br>$7^1 = 7$<br>$7^2 = 49$<br>$7^3 = 343 \\equiv 43 \\pmod{100}$<br>$7^4 = 2401 \\equiv 1 \\pmod{100}$<br>$7^4 \\equiv 1$ என்பதால், $(7^4)^k = 7^{4k} \\equiv 1^k \\equiv 1 \\pmod{100}$." },
                { q: "$F_1=1$, $F_2=3$ மற்றும் $F_n=F_{n-1}+F_{n-2}$ எனக் கொடுக்கப்படின் $F_5$ ஆனது", opts: ["3", "5", "8", "11"], ans: "11", exp: "கொடுக்கப்பட்ட சூத்திரம்: $F_n = F_{n-1} + F_{n-2}$.<br> $F_1 = 1$, $F_2 = 3$<br> $F_3 = 3 + 1 = 4$<br> $F_4 = 4 + 3 = 7$<br> $F_5 = 7 + 4 = 11$." },
                { q: "ஒரு கூட்டுத் தொடர்வரிசையின் முதல் உறுப்பு 1 மற்றும் பொது வித்தியாசம் 4 எனில், பின்வரும் எண்களில் எது இந்தக் கூட்டுத் தொடர்வரிசையில் அமையும்?", opts: ["4551", "10091", "7881", "13531"], ans: "7881", exp: "இங்கு $a=1, d=4$. பொது உறுப்பு $t_n = a + (n-1)d = 1 + (n-1)4 = 4n - 3$.<br>இதன்படி $t_n + 3$ ஆனது 4-ஆல் மீதியின்றி வகுபட வேண்டும்.<br>4551 + 3 = 4554 (4-ஆல் வகுபடாது)<br>10091 + 3 = 10094 (4-ஆல் வகுபடாது)<br>7881 + 3 = 7884 (4-ஆல் வகுபடும்).<br>எனவே 7881 சரியான விடை." },
                { q: "ஒரு கூட்டுத் தொடர்வரிசையின் 6வது உறுப்பின் 6 மடங்கும் 7 வது உறுப்பின் 7 மடங்கும் சமம் எனில், அக்கூட்டுத் தொடர்வரிசையின் 13-வது உறுப்பு", opts: ["0", "6", "7", "13"], ans: "0", exp: "கொடுக்கப்பட்டவை: $6 t_6 = 7 t_7$.<br>$6(a + 5d) = 7(a + 6d)$<br>$6a + 30d = 7a + 42d$<br>$0 = a + 12d$<br>நமக்குத் தெரியும் $t_{13} = a + 12d$. எனவே $t_{13} = 0$." },
                { q: "ஒரு கூட்டுத் தொடர்வரிசையில் 31 உறுப்புகள் உள்ளன. அதன் 16-வது உறுப்பு m எனில், இந்தக் கூட்டுத் தொடர்வரிசையில் உள்ள எல்லா உறுப்புகளின் கூடுதல்", opts: ["16 m", "62 m", "31 m", "$\\frac{31}{2} m$"], ans: "31 m", exp: "மொத்த உறுப்புகள் $n = 31$. மைய உறுப்பு $t_{16} = m$.<br>$t_{16} = a + 15d = m$.<br>கூடுதல் $S_{31} = \\frac{n}{2} [2a + (n-1)d] = \\frac{31}{2} [2a + 30d]$.<br>$S_{31} = 31 [a + 15d] = 31(m)$." },
                { q: "ஒரு கூட்டுத் தொடர்வரிசையில் முதல் உறுப்பு 1 மற்றும் பொது வித்தியாசம் 4. இந்தக் கூட்டுத் தொடர்வரிசையின் எத்தனை உறுப்புகளைக் கூட்டினால் அதன் கூடுதல் 120 கிடைக்கும்?", opts: ["6", "7", "8", "9"], ans: "8", exp: "கொடுக்கப்பட்டவை: $a=1, d=4, S_n=120$.<br>$\\frac{n}{2}[2(1) + (n-1)4] = 120$<br>$n[1 + 2n - 2] = 120$<br>$2n^2 - n - 120 = 0$<br>தீர்க்கும்போது: $(2n+15)(n-8) = 0 \\implies n=8$." },
                { q: "$A=2^{65}$ மற்றும் $B=2^{64}+2^{63}+2^{62}+\\cdots+2^0$ எனக் கொடுக்கப்பட்டுள்ளது. பின்வருவனவற்றில் எது உண்மை?", opts: ["B ஆனது A ஐ விட $2^{64}$ அதிகம்", "A மற்றும் B சமம்", "B ஆனது A-ஐ விட 1 அதிகம்", "A ஆனது B-ஐ விட 1 அதிகம்"], ans: "A ஆனது B-ஐ விட 1 அதிகம்", exp: "தொடர் $B$ ஒரு பெருக்குத் தொடர்வரிசை (G.P). இங்கு $a=1, r=2, n=65$.<br>$B = \\frac{1(2^{65}-1)}{2-1} = 2^{65} - 1$.<br>$A = 2^{65}$ என்பதால், $A - B = 2^{65} - (2^{65} - 1) = 1$.<br>எனவே A ஆனது B-ஐ விட 1 அதிகம்." },
                { q: "$\\frac{3}{16}, \\frac{1}{8}, \\frac{1}{12}, \\frac{1}{18}, \\dots$ என்ற தொடர்வரிசையின் அடுத்த உறுப்பு", opts: ["$\\frac{1}{24}$", "$\\frac{1}{27}$", "$\\frac{2}{3}$", "$\\frac{1}{81}$"], ans: "$\\frac{1}{27}$", exp: "பெருக்கு விகிதம் (Common ratio) $r = \\frac{t_2}{t_1} = \\frac{1/8}{3/16} = \\frac{1}{8} \\times \\frac{16}{3} = \\frac{2}{3}$. <br>அடுத்த உறுப்பு $t_5 = t_4 \\times r = \\frac{1}{18} \\times \\frac{2}{3} = \\frac{2}{54} = \\frac{1}{27}$." },
                { q: "$t_1, t_2, t_3, \\dots$ என்பது ஒரு கூட்டுத் தொடர்வரிசை எனில், $t_6, t_{12}, t_{18}, \\dots$ என்பது", opts: ["ஒரு பெருக்குத் தொடர்வரிசை", "ஒரு கூட்டுத் தொடர்வரிசை", "ஒரு கூட்டுத் தொடர்வரிசையுமல்ல, பெருக்குத் தொடர்வரிசையுமல்ல", "ஒரு மாறிலித் தொடர் வரிசை"], ans: "ஒரு கூட்டுத் தொடர்வரிசை", exp: "ஒரு கூட்டுத் தொடர்வரிசையில் சீரான இடைவெளியில் உறுப்புகளைத் தேர்ந்தெடுத்தால் (இங்கு 6-வது உறுப்புகள்), உருவாகும் புதிய தொடர்வரிசையும் அதேபோன்று சீரான பொது வித்தியாசத்தைக் ($6d$) கொண்டிருக்கும். எனவே இதுவும் ஒரு கூட்டுத் தொடர்வரிசையே." },
                { q: "$(1^3+2^3+3^3+\\cdots+15^3)-(1+2+3+\\cdots+15)$ யின் மதிப்பு", opts: ["14400", "14200", "14280", "14520"], ans: "14280", exp: "கனங்களின் கூடுதல் $\\Sigma n^3 = \\left(\\frac{n(n+1)}{2}\\right)^2$.<br>இயல் எண்களின் கூடுதல் $\\Sigma n = \\frac{n(n+1)}{2}$.<br>$n=15$ எனில்:<br>$\\Sigma n = \\frac{15 \\times 16}{2} = 120$.<br>$\\Sigma n^3 = 120^2 = 14400$.<br>வித்தியாசம் $= 14400 - 120 = 14280$." }
            ],
            "3": [
                { q: "மூன்று மாறிகளில் அமைந்த மூன்று நேரியல் சமன்பாடுகளின் தொகுப்பிற்கு தீர்வுகள் இல்லையெனில், அத்தொகுப்பில் உள்ள தளங்கள்", opts: ["ஒரே ஒரு புள்ளியில் வெட்டுகின்றன", "ஒரே ஒரு கோட்டில் வெட்டுகின்றன", "ஒன்றின் மீது ஒன்று பொருந்தும்", "ஒன்றையொன்று வெட்டாது"], ans: "ஒன்றையொன்று வெட்டாது", exp: "முப்பரிமாண வடிவவியலில், ஒரு சமன்பாட்டுத் தொகுப்பிற்கு தீர்வு இல்லை (Inconsistent) என்றால், அந்தத் தளங்கள் எங்கும் பொதுவான ஒரு புள்ளியில் வெட்டிக்கொள்ளவில்லை (Do not intersect) என்று அர்த்தம்." },
                { q: "$x+y-3z=-6$; $-7y+7z=7$; $3z=9$ என்ற தொகுப்பின் தீர்வு", opts: ["$x=1, y=2, z=3$", "$x=-1, y=2, z=3$", "$x=-1, y=-2, z=3$", "$x=1, y=-2, z=3$"], ans: "$x=1, y=2, z=3$", exp: "சமன்பாடு (3): $3z = 9 \\implies z = 3$.<br>சமன்பாடு (2): $-7y + 7(3) = 7 \\implies -7y + 21 = 7 \\implies -7y = -14 \\implies y = 2$.<br>சமன்பாடு (1): $x + 2 - 3(3) = -6 \\implies x + 2 - 9 = -6 \\implies x - 7 = -6 \\implies x = 1$.<br>தீர்வு: $x=1, y=2, z=3$." },
                { q: "$x^2-2x-24$ மற்றும் $x^2-kx-6$-யின் மீ.பொ.வ. $(x-6)$ எனில், k-யின் மதிப்பு", opts: ["3", "5", "6", "8"], ans: "5", exp: "$(x-6)$ மீ.பொ.வ என்பதால், $x=6$ என்பது இரண்டு பல்லுறுப்புக்கோவைகளுக்கும் தீர்வாக அமையும்.<br>$x^2 - kx - 6 = 0$-ல் $x=6$ எனப் பிரதியிட:<br>$6^2 - k(6) - 6 = 0 \\implies 36 - 6k - 6 = 0 \\implies 30 = 6k \\implies k = 5$." },
                { q: "$\\frac{3y-3}{y}\\div\\frac{7y-7}{3y^2}$ என்பது", opts: ["$\\frac{9y}{7}$", "$\\frac{9y^3}{(21y-21)}$", "$\\frac{21y^2-42y+21}{3y^3}$", "$\\frac{7(y^2-2y+1)}{y^2}$"], ans: "$\\frac{9y}{7}$", exp: "வகுத்தலை பெருக்கலாக மாற்றுக: <br> $\\frac{3(y-1)}{y} \\times \\frac{3y^2}{7(y-1)}$ <br> $(y-1)$ மற்றும் ஒரு $y$ கேன்சல் ஆகும். <br> மீதம் = $\\frac{3 \\times 3y}{7} = \\frac{9y}{7}$." },
                { q: "கீழ்க்கண்டவற்றுள் எது $y^2+\\frac{1}{y^2}$-க்கு சமம் இல்லை.", opts: ["$\\frac{y^4+1}{y^2}$", "$(y+\\frac{1}{y})^2$", "$(y-\\frac{1}{y})^2+2$", "$(y+\\frac{1}{y})^2-2$"], ans: "$(y+\\frac{1}{y})^2$", exp: "விரிவாக்கம் செய்தால்: $(y + \\frac{1}{y})^2 = y^2 + \\frac{1}{y^2} + 2$.<br>எனவே $y^2 + \\frac{1}{y^2}$ மதிப்பானது $(y + \\frac{1}{y})^2$-க்குச் சமமில்லை (காரணம் அங்கு +2 உள்ளது)." },
                { q: "$\\frac{x}{x^2-25}-\\frac{8}{x^2+6x+5}$-யின் சுருங்கிய வடிவம்", opts: ["$\\frac{x^2-7x+40}{(x-5)(x+5)}$", "$\\frac{x^2+7x+40}{(x-5)(x+5)(x+1)}$", "$\\frac{x^2-7x+40}{(x^2-25)(x+1)}$", "$\\frac{x^2+10}{(x^2-25)(x+1)}$"], ans: "$\\frac{x^2-7x+40}{(x^2-25)(x+1)}$", exp: "பகுதிகளைக் காரணிப்படுத்துக:<br>$x^2-25 = (x-5)(x+5)$.<br>$x^2+6x+5 = (x+5)(x+1)$.<br>மீ.சி.ம $(x-5)(x+5)(x+1)$. தொகுதி எண்களைச் சுருக்கினால் $\\frac{x^2-7x+40}{(x^2-25)(x+1)}$ என்ற வடிவம் கிடைக்கும்." },
                { q: "$\\frac{256x^8y^4z^{10}}{25x^6y^6z^6}$-யின் வர்க்கமூலம்", opts: ["$\\frac{16}{5}|\\frac{x^2z^4}{y^2}|$", "$16|\\frac{y^2}{x^2z^4}|$", "$\\frac{16}{5}|\\frac{y}{xz^2}|$", "$\\frac{16}{5}|\\frac{xz^2}{y}|$"], ans: "$\\frac{16}{5}|\\frac{xz^2}{y}|$", exp: "முதலில் பின்னத்தை உள்ளே சுருக்கவும்:<br>$\\frac{256}{25} \\cdot \\frac{x^8}{x^6} \\cdot \\frac{y^4}{y^6} \\cdot \\frac{z^{10}}{z^6} = \\frac{256 x^2 z^4}{25 y^2}$.<br>இப்போது வர்க்கமூலம் எடுக்க: $\\sqrt{\\frac{256}{25}} = \\frac{16}{5}$.<br>$\\sqrt{x^2} = |x|, \\sqrt{z^4} = z^2, \\sqrt{y^2} = |y|$.<br>விடை: $\\frac{16}{5}|\\frac{x z^2}{y}|$." },
                { q: "$x^4+64$ முழு வர்க்கமாக மாற்ற அதனுடன் பின்வருவனவற்றுள் எதைக் கூட்ட வேண்டும்?", opts: ["$4x^2$", "$16x^2$", "$8x^2$", "$-8x^2$"], ans: "$16x^2$", exp: "நமக்குத் தெரியும் $x^4+64 = (x^2)^2 + 8^2$.<br>இது முழு வர்க்கமாக $(a+b)^2 = a^2+b^2+2ab$ மாற $2ab$ உறுப்பு தேவை.<br>இங்கு $a=x^2, b=8$, எனவே $2ab = 2(x^2)(8) = 16x^2$.<br>ஆகவே, $16x^2$-ஐக் கூட்ட வேண்டும்." },
                { q: "$(2x-1)^2=9$-யின் தீர்வு", opts: ["-1", "2", "-1, 2", "இதில் எதுவும் இல்லை"], ans: "-1, 2", exp: "இருபுறமும் வர்க்கமூலம் எடுக்க:<br>$2x - 1 = \\pm 3$<br>நிலை 1: $2x - 1 = 3 \\implies 2x = 4 \\implies x = 2$.<br>நிலை 2: $2x - 1 = -3 \\implies 2x = -2 \\implies x = -1$.<br>தீர்வுகள் -1, 2." },
                { q: "$4x^4-24x^3+76x^2+ax+b$ ஒரு முழு வர்க்கம் எனில், a மற்றும் b-யின் மதிப்பு", opts: ["100, 120", "10, 12", "-120, 100", "12, 10"], ans: "-120, 100", exp: "தொகுமுறை வகுத்தல் முறையில் (Square root by division method):<br>வர்க்கமூலப் பல்லுறுப்புக்கோவை $2x^2 - 6x + 10$ என வரும்.<br>இதை வர்க்கப்படுத்தினால் $(2x^2 - 6x + 10)^2 = 4x^4 - 24x^3 + 76x^2 - 120x + 100$.<br>கெழுக்களை ஒப்பிட, $a = -120$ மற்றும் $b = 100$." },
                { q: "$q^2x^2+p^2x+r^2=0$ என்ற சமன்பாட்டின் மூலங்களின் வர்க்கங்கள், $qx^2+px+r=0$ என்ற சமன்பாட்டின் மூலங்கள் எனில், q, p, r என்பன", opts: ["ஒரு கூட்டுத் தொடர்வரிசையில் உள்ளன", "ஒரு பெருக்குத் தொடர்வரிசையில் உள்ளன", "கூட்டுத் தொடர் வரிசை மற்றும் பெருக்குத்தொடர்வரிசை இரண்டிலும் உள்ளன.", "இதில் எதுவும் இல்லை."], ans: "ஒரு பெருக்குத் தொடர்வரிசையில் உள்ளன", exp: "$qx^2+px+r=0$-ன் மூலங்கள் $\\alpha, \\beta$ என்க.<br>கூடுதல் $\\alpha+\\beta = -p/q$, பெருக்கல் $\\alpha\\beta = r/q$.<br>மற்றொரு சமன்பாட்டின் மூலங்கள் $\\alpha^2, \\beta^2$. கூடுதல் $\\alpha^2+\\beta^2 = -p^2/q^2$.<br>$(\\alpha+\\beta)^2 - 2\\alpha\\beta$-ஐப் பயன்படுத்தினால் $\\frac{p^2-2qr}{q^2} = \\frac{-p^2}{q^2} \\implies 2p^2 = 2qr \\implies p^2 = qr$.<br>இந்த நிபந்தனை பெருக்குத் தொடர்வரிசைக்கு (G.P) உரியது." },
                { q: "ஒரு நேரிய சமன்பாட்டின் வரைபடம் ஒரு _____ ஆகும்.", opts: ["நேர்க்கோடு", "வட்டம்", "பரவளையம்", "அதிபரவளையம்"], ans: "நேர்க்கோடு", exp: "ஒரு நேரிய சமன்பாடு (Linear Equation) என்பது $ax+by+c=0$ என்ற வடிவில் அமைந்திருக்கும். இதன் வரைபடம் எப்பொழுதும் ஒரு நேர்க்கோட்டையே (Straight line) குறிக்கும்." },
                { q: "$x^2+4x+4$ என்ற இருபடி பல்லுறுப்புக் கோவை X அச்சோடு வெட்டும் புள்ளிகளின் எண்ணிக்கை", opts: ["0", "1", "0 அல்லது 1", "2"], ans: "1", exp: "மூலங்களைக் காண்க: $x^2+4x+4 = 0 \\implies (x+2)^2 = 0 \\implies x = -2, -2$.<br>மூலங்கள் மெய்யானவை மற்றும் சமமானவை என்பதால், பரவளையம் X-அச்சை (-2, 0) என்ற ஒரே ஒரு புள்ளியில் மட்டுமே தொட்டுச் செல்லும்." },
                { q: "கொடுக்கப்பட்ட அணி $A=\\begin{pmatrix}1&3&5&7\\\\2&4&6&8\\\\9&11&13&15\\end{pmatrix}$ அணிக்கான நிரை நிரல் மாற்று அணியின் வரிசை", opts: ["$2\\times 3$", "$3\\times 2$", "$3\\times 4$", "$4\\times 3$"], ans: "$4\\times 3$", exp: "கொடுக்கப்பட்ட A அணியின் வரிசை 3 நிரைகள் $\\times$ 4 நிரல்கள் ($3 \\times 4$).<br>நிரை-நிரல் மாற்று அணி ($A^T$) என்பது நிரைகளையும் நிரல்களையும் இடமாற்றுவது. எனவே இதன் வரிசை $4 \\times 3$ ஆக மாறும்." },
                { q: "A என்ற அணியின் வரிசை $2\\times 3$; B என்ற அணியின் வரிசை $3\\times 4$ எனில், AB என்ற அணியின் நிரல்களின் எண்ணிக்கை", opts: ["3", "4", "2", "5"], ans: "4", exp: "அணிப் பெருக்கலின் விதியின்படி, $m \\times n$ அணியையும் $n \\times p$ அணியையும் பெருக்கினால், கிடைக்கும் புதிய அணியின் வரிசை $m \\times p$ ஆகும்.<br>இங்கு, $2 \\times 3$ மற்றும் $3 \\times 4$ பெருக்குகையில் $2 \\times 4$ அணி கிடைக்கும். இதன் நிரல்கள் 4." },
                { q: "நிரல்கள் மற்றும் நிரைகள் சம எண்ணிக்கையில் இல்லாத அணி", opts: ["மூலைவிட்ட அணி", "செவ்வக அணி", "சதுர அணி", "அலகு அணி"], ans: "செவ்வக அணி", exp: "ஒரு அணியில் உள்ள நிரைகளின் எண்ணிக்கையும் நிரல்களின் எண்ணிக்கையும் சமமாக இல்லை ($m \\neq n$) எனில் அது செவ்வக அணி (Rectangular Matrix) என அழைக்கப்படும்." },
                { q: "ஒரு நிரல் அணியின், நிரை நிரல் மாற்று அணி", opts: ["அலகு அணி", "மூலைவிட்ட அணி", "நிரல் அணி", "நிரை அணி"], ans: "நிரை அணி", exp: "ஒரு நிரல் அணி (Column Matrix) $n \\times 1$ என்ற வரிசையைக் கொண்டிருக்கும். இதை நிரை நிரல் மாற்று (Transpose) செய்யும் போது $1 \\times n$ என மாறும். ஒரு நிரை மட்டுமே உள்ள அணி நிரை அணி (Row Matrix) ஆகும்." },
                { q: "$2X+\\begin{pmatrix}1&3\\\\5&7\\end{pmatrix}=\\begin{pmatrix}5&7\\\\9&5\\end{pmatrix}$ எனில், X என்ற அணியைக் காண்க.", opts: ["$\\begin{pmatrix}-2&-2\\\\2&-1\\end{pmatrix}$", "$\\begin{pmatrix}2&2\\\\2&-1\\end{pmatrix}$", "$\\begin{pmatrix}1&2\\\\2&2\\end{pmatrix}$", "$\\begin{pmatrix}2&1\\\\2&2\\end{pmatrix}$"], ans: "$\\begin{pmatrix}2&2\\\\2&-1\\end{pmatrix}$", exp: "$2X = \\begin{pmatrix}5&7\\\\9&5\\end{pmatrix} - \\begin{pmatrix}1&3\\\\5&7\\end{pmatrix}$<br>$2X = \\begin{pmatrix}4&4\\\\4&-2\\end{pmatrix}$<br>2-ஆல் வகுக்க: $X = \\begin{pmatrix}2&2\\\\2&-1\\end{pmatrix}$." },
                { q: "$A=\\begin{pmatrix}1&2\\\\3&4\\\\5&6\\end{pmatrix}, B=\\begin{pmatrix}1&2&3\\\\4&5&6\\\\7&8&9\\end{pmatrix}$ ஆகிய அணிகளைக் கொண்டு எவ்வகை அணிகளைக் கணக்கிட முடியும்? (i) $A^2$ (ii) $B^2$ (iii) $AB$ (iv) $BA$", opts: ["(i), (ii) மட்டும்", "(ii), (iii) மட்டும்", "(ii), (iv) மட்டும்", "அனைத்தும்"], ans: "(ii), (iv) மட்டும்", exp: "A-ன் வரிசை 3x2. B-ன் வரிசை 3x3.<br>(i) $A^2 = (3\\times2) \\times (3\\times2)$ -> பெருக்க இயலாது.<br>(ii) $B^2 = (3\\times3) \\times (3\\times3)$ -> முடியும்.<br>(iii) $AB = (3\\times2) \\times (3\\times3)$ -> பெருக்க இயலாது.<br>(iv) $BA = (3\\times3) \\times (3\\times2)$ -> முடியும். <br>விடை: (ii) மற்றும் (iv) மட்டும்." },
                { q: "$A=\\begin{pmatrix}1&2&3\\\\3&2&1\\end{pmatrix}, B=\\begin{pmatrix}1&0\\\\2&-1\\\\0&2\\end{pmatrix}$ மற்றும் $C=\\begin{pmatrix}0&1\\\\-2&5\\end{pmatrix}$ எனில், பின்வருவனவற்றுள் எவை சரி? (i) $AB+C=\\begin{pmatrix}5&5\\\\5&5\\end{pmatrix}$ (ii) $BC=\\begin{pmatrix}0&1\\\\2&-3\\\\-4&10\\end{pmatrix}$ (iii) $BA+C=\\begin{pmatrix}2&5\\\\3&0\\end{pmatrix}$ (iv) $(AB)C=\\begin{pmatrix}-8&20\\\\-8&13\\end{pmatrix}$", opts: ["(i) மற்றும் (ii) மட்டும்", "(ii) மற்றும் (iii) மட்டும்", "(iii) மற்றும் (iv) மட்டும்", "அனைத்தும்"], ans: "(i) மற்றும் (ii) மட்டும்", exp: "AB பெருக்கலைக் காண்க:<br>$AB = \\begin{pmatrix} (1\\times1+2\\times2+3\\times0) & (1\\times0+2(-1)+3\\times2) \\\\ (3\\times1+2\\times2+1\\times0) & (3\\times0+2(-1)+1\\times2) \\end{pmatrix} = \\begin{pmatrix}5&4\\\\7&0\\end{pmatrix}$.<br>$AB + C = \\begin{pmatrix}5&4\\\\7&0\\end{pmatrix} + \\begin{pmatrix}0&1\\\\-2&5\\end{pmatrix} = \\begin{pmatrix}5&5\\\\5&5\\end{pmatrix}$. எனவே (i) சரியானது." }
            ],
            "4": [
                { q: "$\\frac{AB}{DE}=\\frac{BC}{FD}$ எனில், ABC மற்றும் EDF எப்பொழுது வடிவொத்தவையாக அமையும்.", opts: ["$\\angle B=\\angle E$", "$\\angle A=\\angle D$", "$\\angle B=\\angle D$", "$\\angle A=\\angle F$"], ans: "$\\angle B=\\angle D$", exp: "பக்கம்-கோணம்-பக்கம் (SAS) விதிப்படி இரு முக்கோணங்கள் வடிவொத்ததாக அமைய, விகிதசமப் பக்கங்களுக்கு இடைப்பட்ட கோணம் சமமாக இருக்க வேண்டும்.<br>பக்கங்கள் AB, BC-க்கு இடைப்பட்ட கோணம் $\\angle B$. பக்கங்கள் DE, FD-க்கு இடைப்பட்ட கோணம் $\\angle D$.<br>எனவே $\\angle B = \\angle D$." },
                { q: "$\\Delta LMN$-ல் $\\angle L=60^\\circ, \\angle M=50^\\circ$. $\\Delta LMN\\sim\\Delta PQR$ எனில், $\\angle R$-யின் மதிப்பு", opts: ["$40^\\circ$", "$70^\\circ$", "$30^\\circ$", "$110^\\circ$"], ans: "$70^\\circ$", exp: "$\\Delta LMN$-ல் மூலை விட்டங்களின் கூடுதல் $180^\\circ$.<br>$\\angle N = 180^\\circ - (60^\\circ + 50^\\circ) = 180^\\circ - 110^\\circ = 70^\\circ$.<br>$\\Delta LMN \\sim \\Delta PQR$ என்பதால், ஒத்த கோணங்கள் சமம்.<br>எனவே $\\angle R = \\angle N = 70^\\circ$." },
                { q: "இருசமபக்க முக்கோணம் $\\Delta ABC$-யில் $\\angle C=90^\\circ$ மற்றும் $AC=5$ செ.மீ, எனில் AB ஆனது", opts: ["2.5 செ.மீ", "5 செ.மீ", "10 செ.மீ", "$5\\sqrt{2}$ செ.மீ"], ans: "$5\\sqrt{2}$ செ.மீ", exp: "இது இருசமபக்க செங்கோண முக்கோணம் என்பதால் $AC = BC = 5$ செ.மீ.<br>பிதாகரஸ் தேற்றத்தின்படி கர்ணம் AB:<br>$AB^2 = AC^2 + BC^2 = 5^2 + 5^2 = 25 + 25 = 50$.<br>$AB = \\sqrt{50} = \\sqrt{25 \\times 2} = 5\\sqrt{2}$ செ.மீ." },
                { 
                    q: "கொடுக்கப்பட்ட படத்தில் $ST\\parallel QR$; $PS=2$ செ.மீ மற்றும் $SQ=3$ செ.மீ எனில், $\\Delta PQR$-யின் பரப்பளவுக்கும் $\\Delta PST$-யின் பரப்பளவுக்கும் உள்ள விகிதம்", 
                    svg: `<svg width="250" height="150" viewBox="0 0 250 150">
                            <polygon points="10,130 240,130 180,20" fill="#38bdf8" stroke="#1e293b" stroke-width="2.5"/>

                            <text x="5" y="148" font-family="Cambria" font-size="20" font-style="italic">P</text>
                            <text x="235" y="148" font-family="Cambria" font-size="20" font-style="italic">R</text>
                            <text x="185" y="18" font-family="Cambria" font-size="20" font-style="italic">Q</text>

                            <text x="125" y="148" font-family="Cambria" font-size="20" font-style="italic">T</text>
                          </svg>`,
                    opts: ["25:4", "25:7", "25:11", "25:13"], ans: "25:4",
                    exp: "$ST \\parallel QR$ என்பதால், $\\Delta PST \\sim \\Delta PQR$.<br>பக்க விகிதம் $PQ : PS = (2+3) : 2 = 5 : 2$.<br>வடிவொத்த முக்கோணங்களின் பரப்பளவுகளின் விகிதமானது ஒத்த பக்கங்களின் வர்க்கங்களின் விகிதத்திற்கு சமம்.<br>பரப்பளவு($\\Delta PQR$) / பரப்பளவு($\\Delta PST$) = $(5/2)^2 = 25/4$." 
                },
                { q: "இரு வடிவொத்த முக்கோணங்கள் $\\Delta ABC$ மற்றும் $\\Delta PQR$-யின் சுற்றளவுகள் முறையே 36 செ.மீ மற்றும் 24 செ.மீ ஆகும். $PQ=10$ செ.மீ எனில், AB-யின் நீளம்", opts: ["$6\\frac{2}{3}$ செ.மீ", "$\\frac{10\\sqrt{6}}{3}$ செ.மீ", "66 செ.மீ", "15 செ.மீ"], ans: "15 செ.மீ", exp: "வடிவொத்த முக்கோணங்களுக்கு சுற்றளவுகளின் விகிதம் அவற்றின் ஒத்த பக்கங்களின் விகிதத்திற்குச் சமம்.<br>$\\frac{\\text{சுற்றளவு}(ABC)}{\\text{சுற்றளவு}(PQR)} = \\frac{AB}{PQ}$<br>$\\frac{36}{24} = \\frac{AB}{10}$<br>$AB = \\frac{36 \\times 10}{24} = 15$ செ.மீ." },
                { q: "$\\Delta ABC$-ல் $DE\\parallel BC$. $AB=3.6$ செ.மீ, $AC=2.4$ செ.மீ மற்றும் $AD=2.1$ செ.மீ எனில், AE-யின் நீளம்", opts: ["1.4 செ.மீ", "1.8 செ.மீ", "1.2 செ.மீ", "1.05 செ.மீ"], ans: "1.4 செ.மீ", exp: "தேல்ஸ் தேற்றத்தின்படி (BPT), $DE \\parallel BC$ எனில்:<br>$\\frac{AD}{AB} = \\frac{AE}{AC}$<br>$\\frac{2.1}{3.6} = \\frac{AE}{2.4}$<br>$AE = \\frac{2.1 \\times 2.4}{3.6} = 1.4$ செ.மீ." },
                { q: "$\\Delta ABC$-யில் AD ஆனது, $\\angle BAC$-யின் இருசமவெட்டி. $AB=8$ செ.மீ, $BD=6$ செ.மீ மற்றும் $DC=3$ செ.மீ எனில், பக்கம் AC-யின் நீளம்", opts: ["6 செ.மீ", "4 செ.மீ", "3 செ.மீ", "8 செ.மீ"], ans: "4 செ.மீ", exp: "கோண இருசமவெட்டித் தேற்றத்தின்படி:<br>$\\frac{AB}{AC} = \\frac{BD}{DC}$<br>$\\frac{8}{AC} = \\frac{6}{3} \\implies \\frac{8}{AC} = 2$<br>$AC = \\frac{8}{2} = 4$ செ.மீ." },
                { 
                    q: "கொடுக்கப்பட்ட படத்தில் $\\angle BAC=90^\\circ$ மற்றும் $AD\\perp BC$ எனில்,", 
                    svg: `<svg width="250" height="150" viewBox="0 0 250 150">

                          </svg>`,
                    opts: ["$BD\\cdot CD=BC^2$", "$AB\\cdot AC=BC^2$", "$BD\\cdot CD=AD^2$", "$AB\\cdot AC=AD^2$"], ans: "$BD\\cdot CD=AD^2$",
                    exp: "ஒரு செங்கோண முக்கோணத்தில் கர்ணத்தின் மீது வரையப்படும் குத்துக்கோடு, கர்ணத்தின் இரு பகுதிகளின் பெருக்கற்பலனுக்குச் சமமான வர்க்கத்தைக் கொண்டிருக்கும்.<br>$\\Delta ABD \\sim \\Delta CAD \\implies \\frac{AD}{CD} = \\frac{BD}{AD}$<br>குறுக்கு பெருக்கலில்: $AD^2 = BD \\cdot CD$."
                },
                { q: "6 மீ மற்றும் 11 மீ உயரமுள்ள இரு கம்பங்கள் சமதளத் தரையில் செங்குத்தாக உள்ளன. அவற்றின் அடிகளுக்கு இடையேயுள்ள தொலைவு 12 மீ எனில் அவற்றின் உச்சிகளுக்கு இடையே உள்ள தொலைவு என்ன?", opts: ["13 மீ", "14 மீ", "15 மீ", "12.8 மீ"], ans: "13 மீ", exp: "6 மீ கம்பத்தின் உச்சியிலிருந்து 11 மீ கம்பத்திற்கு ஒரு கிடைமட்ட கோடு வரைய அது ஒரு செங்கோண முக்கோணத்தை உருவாக்கும்.<br>முக்கோணத்தின் அடிப்பக்கம் = 12 மீ.<br>முக்கோணத்தின் உயரம் = 11 மீ - 6 மீ = 5 மீ.<br>உச்சிகளுக்கு இடைப்பட்ட தொலைவு (கர்ணம்) $ = \\sqrt{12^2 + 5^2} = \\sqrt{144 + 25} = \\sqrt{169} = 13$ மீ." },
                { 
                    q: "கொடுக்கப்பட்ட படத்தில் $PR=26$ செ.மீ, $QR=24$ செ.மீ, $\\angle PAQ=90^\\circ$, $PA=6$ செ.மீ மற்றும் $QA=8$ செ.மீ எனில் $\\angle PQR$-ஐக் காண்க.", 
                    svg: `<svg width="250" height="150" viewBox="0 0 250 150">

                    opts: ["$80^\\circ$", "$85^\\circ$", "$75^\\circ$", "$90^\\circ$"], ans: "$90^\\circ$",
                    exp: "$\\Delta PAQ$-ல் பிதாகரஸ் தேற்றப்படி: $PQ = \\sqrt{6^2 + 8^2} = \\sqrt{36+64} = \\sqrt{100} = 10$ செ.மீ.<br>$\\Delta PQR$-ல் பக்கங்கள் $PR=26$, $QR=24$, $PQ=10$.<br>$26^2 = 24^2 + 10^2$ ஆகுமா எனச் சரிபார்க்க:<br>$676 = 576 + 100 \\implies 676 = 676$.<br>இது பிதாகரஸ் தேற்றத்தை நிறைவு செய்வதால் பெரிய பக்கத்திற்கு எதிரே உள்ள கோணம் $\\angle PQR = 90^\\circ$ ஆகும்."

                { q: "வட்டத்தின் தொடுகோடும் அதன் ஆரமும் செங்குத்தாக அமையும் இடம்", opts: ["மையம்", "தொடு புள்ளி", "முடிவிலி", "நாண்"], ans: "தொடு புள்ளி", exp: "வடிவவியல் தேற்றத்தின்படி, வட்டத்தின் தொடுகோடானது ஆரத்திற்கு அதன் தொடு புள்ளியில் (Point of Contact) செங்குத்தாக அமையும்." },
                { q: "வட்டத்தின் வெளிப்புறப் புள்ளியிலிருந்து வட்டத்திற்கு எத்தனை தொடுகோடுகள் வரையலாம்?", opts: ["ஒன்று", "இரண்டு", "முடிவற்ற எண்ணிக்கை", "பூஜ்ஜியம்"], ans: "இரண்டு", exp: "வட்டத்திற்கு வெளியே உள்ள ஏதேனும் ஒரு புள்ளியிலிருந்து வட்டத்திற்குச் சரியாக **இரண்டு** தொடுகோடுகளை வரைய முடியும்." },
                { q: "O-வை மையமாக உடைய வட்டத்திற்கு, வெளியேயுள்ள புள்ளி P-யிலிருந்து வரையப்பட்ட தொடுகோடுகள் PA மற்றும் PB ஆகும். $\\angle APB=70^\\circ$ எனில், $\\angle AOB$-யின் மதிப்பு", opts: ["$100^\\circ$", "$110^\\circ$", "$120^\\circ$", "$130^\\circ$"], ans: "$110^\\circ$", exp: "தொடுகோடும் ஆரமும் செங்குத்தாக அமைவதால் $\\angle OAP = 90^\\circ$ மற்றும் $\\angle OBP = 90^\\circ$.<br>நாற்கரம் OAPB-ல் 4 கோணங்களின் கூடுதல் $360^\\circ$.<br>$\\angle AOB + 90^\\circ + 70^\\circ + 90^\\circ = 360^\\circ$<br>$\\angle AOB + 250^\\circ = 360^\\circ \\implies \\angle AOB = 110^\\circ$." },
                { 
                    q: "படத்தில் O-வை மையமாக உடைய வட்டத்தின் தொடுகோடுகள் CP மற்றும் CQ ஆகும். ARB ஆனது வட்டத்தின் மீதுள்ள புள்ளி R வழியாகச் செல்லும் மற்றொரு தொடுகோடு ஆகும். $CP=11$ செ.மீ மற்றும் $BC=7$ செ.மீ எனில் BR-யின் நீளம்",
                    svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400"><defs><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M 0 1 L 10 5 L 0 9 z" fill="#e6007e" /></marker></defs><!-- Circle and Vertical Tangent --><g fill="none" stroke="#00a0e9" stroke-width="4"><circle cx="180" cy="200" r="130" /><line x1="310" y1="113.3" x2="310" y2="286.7" /></g><!-- Magenta Tangents --><g stroke="#e6007e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"><line x1="518" y1="200" x2="110" y2="30" /><line x1="518" y1="200" x2="110" y2="370" /></g><!-- Dots --><g fill="#231F20"><circle cx="180" cy="200" r="5.5" /><circle cx="230" cy="80" r="5.5" /><circle cx="230" cy="320" r="5.5" /><circle cx="310" cy="200" r="5.5" /></g><!-- Labels --><g font-family="Times New Roman, serif" font-style="italic" font-size="38" fill="#231F20"><text x="180" y="245" text-anchor="middle">O</text><text x="245" y="70">P</text><text x="315" y="92">A</text><text x="325" y="212">R</text><text x="315" y="325">B</text><text x="245" y="365">Q</text><text x="515" y="240">C</text></g></svg>`,
                    opts: ["6 செ.மீ", "5 செ.மீ", "8 செ.மீ", "4 செ.மீ"], ans: "4 செ.மீ",
                    exp: "வட்டத்தின் வெளிப் புள்ளியில் இருந்து வரையப்படும் தொடுகோடுகள் சம நீளம் கொண்டவை.<br>C-யிலிருந்து: $CQ = CP = 11$ செ.மீ.<br>B-யிலிருந்து: $BQ = BR$.<br>$CQ = CB + BQ \\implies 11 = 7 + BQ \\implies BQ = 4$ செ.மீ.<br>$BR = BQ$ என்பதால், $BR = 4$ செ.மீ."

                {

                    exp: "தொடுகோடு PR ஆரத்திற்கு (OP) செங்குத்தானது. $\\angle OPR = 90^\\circ$.<br>கொடுக்கப்பட்டுள்ளது $\\angle QPR = 60^\\circ$. எனவே $\\angle OPQ = 90^\\circ - 60^\\circ = 30^\\circ$.<br>$\\Delta OPQ$-ல் $OP = OQ$ (ஆரங்கள்). ஆதலால் இது இருசமபக்க முக்கோணம். $\\angle OQP = 30^\\circ$.<br>மூன்று கோணங்களின் கூடுதல் $180^\\circ$ என்பதால், $\\angle POQ = 180^\\circ - (30^\\circ + 30^\\circ) = 120^\\circ$."

            // --- CHAPTERS 5 TO 8 (NEW EXPLANATIONS ADDED) ---
            "5": [
                { q: "$(-5,0)$, $(0,-5)$ மற்றும் $(5,0)$ ஆகிய புள்ளிகளால் அமைக்கப்படும் முக்கோணத்தின் பரப்பு", opts: ["0 ச.அலகுகள்", "25 ச.அலகுகள்", "5 ச.அலகுகள்", "எதுவுமில்லை"], ans: "25 ச.அலகுகள்", exp: "$(-5,0)$ முதல் $(5,0)$ வரை உள்ள அடிப்பக்கத்தின் நீளம் $= 10$ அலகுகள். ஆதிப்புள்ளியிலிருந்து $(0,-5)$ வரை உள்ள உயரம் $= 5$ அலகுகள்.<br>பரப்பு $= \\frac{1}{2} \\times \\text{அடிப்பக்கம்} \\times \\text{உயரம்} = \\frac{1}{2} \\times 10 \\times 5 = 25$ ச.அலகுகள்." },
                { q: "ஒரு சுவரின் அருகே நடந்து சென்று கொண்டிருக்கும் ஒரு நபருக்கும் சுவருக்கும் இடையே உள்ள தூரம் 10 அலகுகள். சுவரை Y-அச்சாகக் கருதினால், அந்த நபர் செல்லும் பாதை என்பது", opts: ["$x=10$", "$y=10$", "$x=0$", "$y=0$"], ans: "$x=10$", exp: "சுவர் Y-அச்சாக ($x=0$) செயல்படுகிறது.<br>Y-அச்சிலிருந்து 10 அலகுகள் தொலைவில் அதற்கு இணையாகச் செல்லும் கோட்டின் சமன்பாடு $x=10$ (அல்லது $x=-10$) ஆகும்." },
                { q: "$x=11$ எனக் கொடுக்கப்பட்ட நேர்க்கோட்டின் சமன்பாடானது", opts: ["X-அச்சுக்கு இணை", "Y-அச்சுக்கு இணை", "ஆதிப் புள்ளி வழிச் செல்லும்", "$(0,11)$ என்ற புள்ளி வழிச் செல்லும்"], ans: "Y-அச்சுக்கு இணை", exp: "$x = c$ (இங்கு c ஒரு மாறிலி) என்ற வடிவில் உள்ள எந்தவொரு நேர்க்கோடும் எப்பொழுதும் Y-அச்சுக்கு இணையாக (Parallel to Y-axis) இருக்கும்." },
                { q: "$(5,7)$, $(3,p)$ மற்றும் $(6,6)$ என்பன ஒரு கோடமைந்தவை எனில், p-யின் மதிப்பு", opts: ["3", "6", "9", "12"], ans: "9", exp: "A, B, C கோடமைந்தவை எனில் AB-ன் சாய்வு = BC-ன் சாய்வு.<br>$\\frac{p-7}{3-5} = \\frac{6-p}{6-3}$<br>$\\frac{p-7}{-2} = \\frac{6-p}{3}$<br>$3p - 21 = -12 + 2p \\implies p = 9$." },
                { q: "$3x-y=4$ மற்றும் $x+y=8$ ஆகிய நேர்க்கோடுகள் சந்திக்கும் புள்ளி", opts: ["$(5,3)$", "$(2,4)$", "$(3,5)$", "$(4,3)$"], ans: "$(3,5)$", exp: "இரண்டு சமன்பாடுகளையும் கூட்டுக:<br>$(3x - y) + (x + y) = 4 + 8$<br>$4x = 12 \\implies x = 3$.<br>இதை $x+y=8$ என்பதில் பிரதியிட $\\implies 3+y=8 \\implies y=5$.<br>சந்திக்கும் புள்ளி $(3, 5)$." },
                { q: "$(12,3)$, $(4,a)$ என்ற புள்ளிகளை இணைக்கும் கோட்டின் சாய்வு $\\frac{1}{8}$ எனில் 'a'-யின் மதிப்பு", opts: ["1", "4", "$-5$", "2"], ans: "2", exp: "சாய்வு $m = \\frac{y_2 - y_1}{x_2 - x_1}$<br>$\\frac{a - 3}{4 - 12} = \\frac{1}{8}$<br>$\\frac{a - 3}{-8} = \\frac{1}{8}$<br>$a - 3 = -1 \\implies a = 2$." },
                { q: "$(0,0)$ மற்றும் $(-8,8)$ என்ற புள்ளிகளை இணைக்கும் கோட்டிற்குச் செங்குத்தான கோட்டின் சாய்வு", opts: ["$-1$", "1", "$\\frac{1}{3}$", "$-8$"], ans: "1", exp: "$(0,0)$ மற்றும் $(-8,8)$ இணைக்கும் கோட்டின் சாய்வு $m_1 = \\frac{8 - 0}{-8 - 0} = -1$.<br>செங்குத்துக் கோட்டின் சாய்வு $m_1 \\times m_2 = -1$<br>$-1 \\times m_2 = -1 \\implies m_2 = 1$." },
                { q: "கோட்டுத்துண்டு PQ-யின் சாய்வு $\\frac{1}{\\sqrt{3}}$ எனில், PQ-க்கு செங்குத்தான இரு சம வெட்டியின் சாய்வு", opts: ["$\\sqrt{3}$", "$-\\sqrt{3}$", "$\\frac{1}{\\sqrt{3}}$", "0"], ans: "$-\\sqrt{3}$", exp: "PQ-ன் சாய்வு $m = \\frac{1}{\\sqrt{3}}$.<br>அதன் செங்குத்து இருசமவெட்டி PQ-க்குச் செங்குத்தானது. செங்குத்துக் கோட்டின் சாய்வு $=\\frac{-1}{m}$.<br>சாய்வு $= \\frac{-1}{1/\\sqrt{3}} = -\\sqrt{3}$." },
                { q: "Y அச்சில் அமையும் புள்ளி A-யின் செங்குத்துத் தொலைவு 8 மற்றும் X அச்சில் அமையும் புள்ளி B-யின் கிடைமட்டத் தொலைவு 5 எனில், AB என்ற நேர்க்கோட்டின் சமன்பாடு", opts: ["$8x+5y=40$", "$8x-5y=40$", "$x=8$", "$y=5$"], ans: "$8x+5y=40$", exp: "y-வெட்டுத்துண்டு $b = 8$. x-வெட்டுத்துண்டு $a = 5$.<br>வெட்டுத்துண்டு சமன்பாடு: $\\frac{x}{a} + \\frac{y}{b} = 1$<br>$\\frac{x}{5} + \\frac{y}{8} = 1 \\implies 8x + 5y = 40$." },
                { q: "$7x-3y+4=0$ என்ற நேர்க்கோட்டிற்குச் செங்குத்தாகவும், ஆதிப்புள்ளி வழிச் செல்லும் நேர்க்கோட்டின் சமன்பாடு", opts: ["$3x-7y+4=0$", "$7x-3y+4=0$", "$3x+7y=0$", "$7x-3y=0$"], ans: "$3x+7y=0$", exp: "$ax + by + c = 0$ என்ற கோட்டிற்குச் செங்குத்தான கோடு $bx - ay + k = 0$ என்ற வடிவில் இருக்கும்.<br>எனவே, $3x + 7y + k = 0$.<br>இது ஆதிப்புள்ளி $(0,0)$ வழியே செல்வதால், $3(0) + 7(0) + k = 0 \\implies k = 0$.<br>விடை: $3x + 7y = 0$." },
                { q: "(i) $l_1:3y=4x+5$ (ii) $l_2:4y=3x-1$ (iii) $l_3:4y+3x=7$ (iv) $l_4:4x+3y=2$ கொடுக்கப்பட்ட நான்கு நேர்க்கோடுகளுக்குக் கீழ்க்கண்ட கூற்றுகளில் எது உண்மை", opts: ["$l_1$ மற்றும் $l_2$ செங்குத்தானவை", "$l_1$ மற்றும் $l_4$ இணையானவை", "$l_2$ மற்றும் $l_4$ செங்குத்தானவை", "$l_2$ மற்றும் $l_3$ இணையானவை"], ans: "$l_2$ மற்றும் $l_4$ செங்குத்தானவை", exp: "$y = mx+c$ வடிவில் மாற்றி சாய்வைக் காண்க:<br>$l_2$: சாய்வு $m_2 = \\frac{3}{4}$.<br>$l_4$: சாய்வு $m_4 = -\\frac{4}{3}$.<br>$m_2 \\times m_4 = \\frac{3}{4} \\times -\\frac{4}{3} = -1$ என்பதால், $l_2$ மற்றும் $l_4$ செங்குத்தானவை." }, 
                { q: "$8y=4x+21$ என்ற நேர்க்கோட்டின் சமன்பாட்டிற்குக் கீழ்க்கண்டவற்றில் எது உண்மை", opts: ["சாய்வு 0.5 மற்றும் y வெட்டுத்துண்டு 2.6", "சாய்வு 5 மற்றும் y வெட்டுத்துண்டு 1.6", "சாய்வு 0.5 மற்றும் y வெட்டுத்துண்டு 1.6", "சாய்வு 5 மற்றும் y வெட்டுத்துண்டு 2.6"], ans: "சாய்வு 0.5 மற்றும் y வெட்டுத்துண்டு 2.6", exp: "$y = mx + c$ வடிவத்திற்கு மாற்றுக:<br>$y = \\frac{4}{8}x + \\frac{21}{8}$<br>$y = 0.5x + 2.625$<br>இதன்படி சாய்வு 0.5 மற்றும் y-வெட்டுத்துண்டு தோராயமாக 2.6." },
                { q: "ஒரு நாற்கரமானது ஒரு சரிவகமாக அமையத் தேவையான நிபந்தனை", opts: ["இரு பக்கங்கள் இணை.", "இரு பக்கங்கள் இணை மற்றும் இரு பக்கங்கள் இணையற்றவை.", "எதிரெதிர் பக்கங்கள் இணை.", "அனைத்துப் பக்கங்களும் சமம்."], ans: "இரு பக்கங்கள் இணை மற்றும் இரு பக்கங்கள் இணையற்றவை.", exp: "வடிவவியல் வரையறையின்படி, ஒரு நாற்கரத்தின் ஒரு சோடி எதிரெதிர் பக்கங்கள் இணை (Parallel) மற்றும் மற்றொரு சோடி பக்கங்கள் இணையற்றவை (Non-parallel) எனில் அது சரிவகம் (Trapezium) எனப்படும்." },
                { q: "சாய்வைப் பயன்படுத்தி நாற்கரமானது ஓர் இணைகரமாக உள்ளது எனக் கூற நாம் காண வேண்டியவை", opts: ["இரு பக்கங்களின் சாய்வுகள்", "இரு சோடி எதிர் பக்கங்களின் சாய்வுகள்", "அனைத்துப் பக்கங்களின் நீளங்கள்", "இரு பக்கங்களின் சாய்வுகள் மற்றும் நீளங்கள்"], ans: "இரு சோடி எதிர் பக்கங்களின் சாய்வுகள்", exp: "இணைகரத்தின் எதிரெதிர் பக்கங்கள் இணையாக இருக்கும். இணையான கோடுகளுக்குச் சாய்வுகள் சமம். எனவே இரண்டு சோடி எதிரெதிர் பக்கங்களின் சாய்வுகளைக் கண்டுபிடித்து ஒப்பிட வேண்டும்." },
                { q: "$(2,1)$-ஐ வெட்டுப் புள்ளியாகக் கொண்ட இரு நேர்க்கோடுகள்", opts: ["$x-y-3=0; 3x-y-7=0$", "$x+y=3; 3x+y=7$", "$3x+y=3; x+y=7$", "$x+3y-3=0; x-y-7=0$"], ans: "$x+y=3; 3x+y=7$", exp: "$(x,y) = (2,1)$ என்ற புள்ளியைச் சமன்பாடுகளில் பிரதியிட்டுச் சரிபார்க்கவும்:<br>$x+y=3 \\implies 2+1 = 3$ (சரி)<br>$3x+y=7 \\implies 3(2)+1 = 7$ (சரி).<br>எனவே, புள்ளி $(2,1)$ இந்த இரண்டு நேர்க்கோடுகளையும் நிறைவு செய்கிறது." }
            ],
            "6": [
                { q: "$\\sin^2\\theta+\\frac{1}{1+\\tan^2\\theta}$-ன் மதிப்பு", opts: ["$\\tan^2\\theta$", "1", "$\\cot^2\\theta$", "0"], ans: "1", exp: "முக்கோணவியல் முற்றொருமை: $1 + \\tan^2\\theta = \\sec^2\\theta$.<br>எனவே, $\\frac{1}{1+\\tan^2\\theta} = \\frac{1}{\\sec^2\\theta} = \\cos^2\\theta$.<br>மீண்டும் பிரதியிட: $\\sin^2\\theta + \\cos^2\\theta = 1$." },
                { q: "$\\tan\\theta\\csc^2\\theta-\\tan\\theta$-ன் மதிப்பு", opts: ["$\\sec\\theta$", "$\\cot^2\\theta$", "$\\sin\\theta$", "$\\cot\\theta$"], ans: "$\\cot\\theta$", exp: "$\\tan\\theta$-ஐப் பொது காரணியாக வெளியில் எடுக்க:<br>$\\tan\\theta (\\csc^2\\theta - 1)$<br>நமக்குத் தெரியும் $\\csc^2\\theta - 1 = \\cot^2\\theta$.<br>எனவே, $\\tan\\theta \\cdot \\cot^2\\theta = \\tan\\theta \\cdot \\frac{1}{\\tan^2\\theta} = \\frac{1}{\\tan\\theta} = \\cot\\theta$." },
                { q: "$(\\sin\\alpha+\\csc\\alpha)^2+(\\cos\\alpha+\\sec\\alpha)^2=k+\\tan^2\\alpha+\\cot^2\\alpha$ எனில் k-ன் மதிப்பு", opts: ["9", "7", "5", "3"], ans: "7", exp: "வர்க்கங்களை விரிவாக்குக:<br>$(\\sin^2\\alpha + \\csc^2\\alpha + 2) + (\\cos^2\\alpha + \\sec^2\\alpha + 2)$<br>$= (\\sin^2\\alpha + \\cos^2\\alpha) + 4 + (1 + \\cot^2\\alpha) + (1 + \\tan^2\\alpha)$<br>$= 1 + 4 + 2 + \\tan^2\\alpha + \\cot^2\\alpha = 7 + \\tan^2\\alpha + \\cot^2\\alpha$.<br>ஒப்பிட, $k = 7$." },
                { q: "$\\sin\\theta+\\cos\\theta=a$ மற்றும் $\\sec\\theta+\\csc\\theta=b$ எனில் $b(a^2-1)$-ன் மதிப்பு", opts: ["$2a$", "$3a$", "0", "$2ab$"], ans: "$2a$", exp: "முதலில் $a^2-1$ காண்க:<br>$(\\sin\\theta+\\cos\\theta)^2 - 1 = (1 + 2\\sin\\theta\\cos\\theta) - 1 = 2\\sin\\theta\\cos\\theta$.<br>இப்போது $b = \\sec\\theta + \\csc\\theta = \\frac{1}{\\cos\\theta} + \\frac{1}{\\sin\\theta} = \\frac{\\sin\\theta+\\cos\\theta}{\\sin\\theta\\cos\\theta}$.<br>$b(a^2-1) = \\left(\\frac{\\sin\\theta+\\cos\\theta}{\\sin\\theta\\cos\\theta}\\right) \\times 2\\sin\\theta\\cos\\theta = 2(\\sin\\theta+\\cos\\theta) = 2a$." },
                { q: "$5x=\\sec\\theta$ மற்றும் $\\frac{5}{y}=\\tan\\theta$ எனில் $x^2-\\frac{1}{y^2}$-ன் மதிப்பு", opts: ["25", "$\\frac{1}{25}$", "5", "1"], ans: "$\\frac{1}{25}$", exp: "கொடுக்கப்பட்டவற்றிலிருந்து, $x = \\frac{\\sec\\theta}{5}$ மற்றும் $\\frac{1}{y} = \\frac{\\tan\\theta}{5}$.<br>சமன்பாட்டில் பிரதியிட:<br>$x^2 - \\frac{1}{y^2} = \\left(\\frac{\\sec\\theta}{5}\\right)^2 - \\left(\\frac{\\tan\\theta}{5}\\right)^2 = \\frac{\\sec^2\\theta - \\tan^2\\theta}{25}$.<br>$\\sec^2\\theta - \\tan^2\\theta = 1$ என்பதால், விடை $\\frac{1}{25}$." },
                { q: "$\\sin\\theta=\\cos\\theta$ எனில் $2\\tan^2\\theta+\\sin^2\\theta-1$-ன் மதிப்பு", opts: ["$\\frac{-3}{2}$", "$\\frac{3}{2}$", "$\\frac{2}{3}$", "$\\frac{-2}{3}$"], ans: "$\\frac{3}{2}$", exp: "$\\sin\\theta = \\cos\\theta$ எனில், $\\frac{\\sin\\theta}{\\cos\\theta} = 1 \\implies \\tan\\theta = 1 \\implies \\theta = 45^\\circ$.<br>$\\theta = 45^\\circ$ எனப் பிரதியிட:<br>$2\\tan^2(45^\\circ) + \\sin^2(45^\\circ) - 1 = 2(1)^2 + \\left(\\frac{1}{\\sqrt{2}}\\right)^2 - 1$<br>$= 2 + \\frac{1}{2} - 1 = 1 + \\frac{1}{2} = \\frac{3}{2}$." },
                { q: "$x=a\\tan\\theta$ மற்றும் $y=b\\sec\\theta$ எனில்", opts: ["$\\frac{y^2}{b^2}-\\frac{x^2}{a^2}=1$", "$\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=1$", "$\\frac{x^2}{a^2}+\\frac{y^2}{b^2}=1$", "$\\frac{x^2}{a^2}-\\frac{y^2}{b^2}=0$"], ans: "$\\frac{y^2}{b^2}-\\frac{x^2}{a^2}=1$", exp: "கொடுக்கப்பட்டவை: $\\tan\\theta = \\frac{x}{a}$ மற்றும் $\\sec\\theta = \\frac{y}{b}$.<br>$\\sec^2\\theta - \\tan^2\\theta = 1$ என்ற முற்றொருமையைப் பயன்படுத்த:<br>மதிப்புகளைப் பிரதியிட $\\left(\\frac{y}{b}\\right)^2 - \\left(\\frac{x}{a}\\right)^2 = 1 \\implies \\frac{y^2}{b^2} - \\frac{x^2}{a^2} = 1$." },
                { q: "$(1+\\tan\\theta+\\sec\\theta)(1+\\cot\\theta-\\csc\\theta)$-ன் மதிப்பு", opts: ["0", "1", "2", "-1"], ans: "2", exp: "$\\sin, \\cos$-க்கு மாற்றுக:<br>$\\left(1 + \\frac{\\sin}{\\cos} + \\frac{1}{\\cos}\\right) \\left(1 + \\frac{\\cos}{\\sin} - \\frac{1}{\\sin}\\right)$<br>$= \\left(\\frac{\\cos+\\sin+1}{\\cos}\\right) \\left(\\frac{\\sin+\\cos-1}{\\sin}\\right)$<br>$= \\frac{(\\sin+\\cos)^2 - 1^2}{\\sin\\cos} = \\frac{1 + 2\\sin\\cos - 1}{\\sin\\cos} = \\frac{2\\sin\\cos}{\\sin\\cos} = 2$." },
                { q: "$a\\cot\\theta+b\\csc\\theta=p$ மற்றும் $b\\cot\\theta+a\\csc\\theta=q$ எனில் $p^2-q^2$-ன் மதிப்பு", opts: ["$a^2-b^2$", "$b^2-a^2$", "$a^2+b^2$", "$b-a$"], ans: "$b^2-a^2$", exp: "$p^2$ மற்றும் $q^2$-ஐ விரிக்க:<br>$p^2 = a^2\\cot^2\\theta + b^2\\csc^2\\theta + 2ab\\cot\\theta\\csc\\theta$<br>$q^2 = b^2\\cot^2\\theta + a^2\\csc^2\\theta + 2ab\\cot\\theta\\csc\\theta$<br>$p^2 - q^2 = a^2(\\cot^2\\theta-\\csc^2\\theta) + b^2(\\csc^2\\theta-\\cot^2\\theta)$<br>$\\csc^2\\theta - \\cot^2\\theta = 1$ என்பதால், $a^2(-1) + b^2(1) = b^2 - a^2$." },
                { q: "ஒரு கோபுரத்தின் உயரத்திற்கும் அதன் நிழலின் நீளத்திற்கும் உள்ள விகிதம் $\\sqrt{3}:1$, எனில் சூரியனைக் காணும் ஏற்றக்கோண அளவானது", opts: ["$45^\\circ$", "$90^\\circ$", "$30^\\circ$", "$60^\\circ$"], ans: "$60^\\circ$", exp: "உயரம் $h$, நிழல் $x$ என்க. $\\tan\\theta = \\frac{\\text{எதிர்ப்பக்கம்}}{\\text{அடுத்தடுத்த பக்கம்}} = \\frac{h}{x}$.<br>விகிதம் $\\frac{h}{x} = \\frac{\\sqrt{3}}{1}$.<br>$\\tan\\theta = \\sqrt{3} \\implies \\theta = 60^\\circ$." },
                { q: "ஒரு மின் கம்பமானது அதன் அடியில் சமதளப் பரப்பில் உள்ள ஒரு புள்ளியில் $30^\\circ$ கோணத்தை ஏற்படுத்துகிறது. முதல் புள்ளிக்கு 'b' மீ உயரத்தில் உள்ள இரண்டாவது புள்ளியிலிருந்து மின்கம்பத்தின் அடிக்கு இறக்கக்கோணம் $60^\\circ$ எனில் மின் கம்பத்தின் உயரமானது (மீட்டரில்)", opts: ["$\\sqrt{3}b$", "$\\frac{b}{3}$", "$\\frac{b}{2}$", "$\\frac{b}{\\sqrt{3}}$"], ans: "$\\frac{b}{3}$", exp: "கம்பத்தின் உயரம் $h$, தொலைவு $x$ என்க.<br>தரையில் இருந்து: $\\tan 30^\\circ = \\frac{h}{x} \\implies x = h\\sqrt{3}$.<br>$b$ உயரத்தில் இருந்து: $\\tan 60^\\circ = \\frac{b}{x} \\implies x = \\frac{b}{\\sqrt{3}}$.<br>$x$-ஐ சமன்படுத்த: $h\\sqrt{3} = \\frac{b}{\\sqrt{3}} \\implies h = \\frac{b}{3}$." },
                { q: "ஒரு கோபுரத்தின் உயரம் 60 மீ ஆகும். சூரியனை காணும் ஏற்றக்கோணம் $30^\\circ$-லிருந்து $45^\\circ$ ஆக உயரும்போது கோபுரத்தின் நிழலானது x மீ குறைகிறது எனில், x-ன் மதிப்பு", opts: ["41.92 மீ", "43.92 மீ", "43 மீ", "45.6 மீ"], ans: "43.92 மீ", exp: "ஆரம்ப நிழல் $y$ என்க. $\\tan 30^\\circ = \\frac{60}{y} \\implies y = 60\\sqrt{3}$.<br>புதிய நிழல் $y-x$. $\\tan 45^\\circ = \\frac{60}{y-x} \\implies 1 = \\frac{60}{y-x} \\implies y-x = 60$.<br>$x = y - 60 = 60\\sqrt{3} - 60 = 60(1.732 - 1) = 60(0.732) = 43.92$ மீ." },
                { q: "பல அடுக்குக் கட்டடத்தின் உச்சியிலிருந்து 20 மீ உயரமுள்ள கட்டடத்தின் உச்சி, அடி ஆகியவற்றின் இறக்கக்கோணங்கள் முறையே $30^\\circ$ மற்றும் $60^\\circ$ எனில் பல அடுக்குக் கட்டடத்தின் உயரம் மற்றும் இரு கட்டடங்களுக்கு இடையேயுள்ள தொலைவானது (மீட்டரில்)", opts: ["$20, 10\\sqrt{3}$", "$20, 10$", "$30, 5\\sqrt{3}$", "$30, 10\\sqrt{3}$"], ans: "$30, 10\\sqrt{3}$", exp: "பெரிய கட்டட உயரம் $H$, தொலைவு $x$ என்க.<br>உச்சிக்கு இறக்கக்கோணம்: $\\tan 30^\\circ = \\frac{H-20}{x} \\implies x = \\sqrt{3}(H-20)$.<br>அடிக்கு இறக்கக்கோணம்: $\\tan 60^\\circ = \\frac{H}{x} \\implies x = \\frac{H}{\\sqrt{3}}$.<br>$x$-ஐ ஒப்பிட: $\\sqrt{3}(H-20) = \\frac{H}{\\sqrt{3}} \\implies 3(H-20) = H \\implies 2H = 60 \\implies H = 30$ மீ.<br>இதிலிருந்து $x = \\frac{30}{\\sqrt{3}} = 10\\sqrt{3}$ மீ." },
                { q: "இரண்டு நபர்களுக்கு இடைப்பட்ட தொலைவு x மீ ஆகும். முதல் நபரின் உயரமானது இரண்டாவது நபரின் உயரத்தைப் போல இரு மடங்காக உள்ளது. அவர்களுக்கு இடைப்பட்ட தொலைவு நேர்கோட்டின் மையப் புள்ளியிலிருந்து இரு நபர்களின் உச்சியின் ஏற்றக் கோணங்கள் நிரப்புக்கோணங்கள் எனில், குட்டையாக உள்ள நபரின் உயரம் (மீட்டரில்) காண்க.", opts: ["$\\sqrt{2}x$", "$\\frac{x}{2\\sqrt{2}}$","$\\frac{x}{\\sqrt{2}}$","$2x$"], ans: "$\\frac{x}{2\\sqrt{2}}$", exp: "சிறிய உயரம் $h$, பெரிய உயரம் $2h$ என்க. மையப்புள்ளித் தொலைவு $x/2$.<br>$\\tan\\theta_1 = \\frac{2h}{x/2} = \\frac{4h}{x}$. $\\tan\\theta_2 = \\frac{h}{x/2} = \\frac{2h}{x}$.<br>நிரப்புக்கோணங்கள் என்பதால், $\\tan\\theta_1 \\times \\tan\\theta_2 = 1$.<br>$\\left(\\frac{4h}{x}\\right) \\left(\\frac{2h}{x}\\right) = 1 \\implies 8h^2 = x^2 \\implies h^2 = \\frac{x^2}{8} \\implies h = \\frac{x}{2\\sqrt{2}}$." },
                { q: "ஓர் ஏரியின் மேலே h மீ உயரத்தில் உள்ள ஒரு புள்ளியிலிருந்து மேகத்திற்கு உள்ள ஏற்றக்கோணம் $\\beta$. மேக பிம்பத்தின் இறக்கக்கோணம் $45^\\circ$ எனில் ஏரியில் இருந்து மேகத்திற்கு உள்ள உயரமானது (மீட்டரில்)", opts: ["$\\frac{h(1+\\tan\\beta)}{1-\\tan\\beta}$", "$h\\tan(45^\\circ-\\beta)$", "$\\frac{h(1-\\tan\\beta)}{1+\\tan\\beta}$", "இவை ஒன்றும் இல்லை"], ans: "$\\frac{h(1+\\tan\\beta)}{1-\\tan\\beta}$", exp: "ஏரியிலிருந்து மேகத்தின் உயரம் $H$ என்க. $h$ உயரத்திலிருந்து பார்க்கும்போது எதிர்ப்பக்கம் $H-h$.<br>$\\tan\\beta = \\frac{H-h}{x} \\implies x = \\frac{H-h}{\\tan\\beta}$.<br>பிம்பத்தின் இறக்கக்கோணத்தின் போது மொத்த உயரம் $H+h$.<br>$\\tan 45^\\circ = \\frac{H+h}{x} \\implies x = H+h$.<br>$x$-ஐ சமன்படுத்த: $H+h = \\frac{H-h}{\\tan\\beta} \\implies H\\tan\\beta + h\\tan\\beta = H - h \\implies H = \\frac{h(1+\\tan\\beta)}{1-\\tan\\beta}$." }
            ],
            "7": [
                { q: "15 செ.மீ உயரமும் 16 செ.மீ விட்டமும் கொண்ட ஒரு நேர்வட்டக் கூம்பின் வளைபரப்பு", opts: ["$60\\pi$ ச.செ.மீ", "$68\\pi$ ச.செ.மீ", "$120\\pi$ ச.செ.மீ", "$136\\pi$ ச.செ.மீ"], ans: "$136\\pi$ ச.செ.மீ", exp: "விட்டம் $d=16 \\implies$ ஆரம் $r=8$ செ.மீ. உயரம் $h=15$ செ.மீ.<br>சாயுயரம் $l = \\sqrt{r^2+h^2} = \\sqrt{8^2+15^2} = \\sqrt{64+225} = 17$ செ.மீ.<br>கூம்பின் வளைபரப்பு $= \\pi r l = \\pi \\times 8 \\times 17 = 136\\pi$ ச.செ.மீ." },
                { q: "r அலகுகள் ஆரம் உடைய இரு சம அரைக்கோளங்களின் அடிப்பகுதிகள் இணைக்கப்படும் போது உருவாகும் திண்மத்தின் புறப்பரப்பு", opts: ["$4\\pi r^2$ ச.அ", "$6\\pi r^2$ ச.அ", "$3\\pi r^2$ ச.அ", "$8\\pi r^2$ ச.அ"], ans: "$4\\pi r^2$ ச.அ", exp: "இரண்டு ஒத்த திண்ம அரைக்கோளங்களை அவற்றின் அடிப்பகுதிகளில் இணைத்தால் ஒரு முழு கோளம் கிடைக்கும்.<br>முழு கோளத்தின் புறப்பரப்பு $= 4\\pi r^2$." },
                { q: "ஆரம் 5 செ.மீ மற்றும் சாயுயரம் 13 செ.மீ உடைய நேர்வட்டக் கூம்பின் உயரம்", opts: ["12 செ.மீ", "10 செ.மீ", "13 செ.மீ", "5 செ.மீ"], ans: "12 செ.மீ", exp: "கூம்பிற்கு, $l^2 = r^2 + h^2$.<br>கொடுக்கப்பட்டது $r = 5$, $l = 13$.<br>$h = \\sqrt{l^2 - r^2} = \\sqrt{13^2 - 5^2} = \\sqrt{169 - 25} = \\sqrt{144} = 12$ செ.மீ." },
                { q: "ஓர் உருளையின் உயரத்தை மாற்றாமல் அதன் ஆரத்தைப் பாதியாகக் கொண்டு புதிய உருளை உருவாக்கப்படுகிறது. புதிய மற்றும் முந்தைய உருளைகளின் கன அளவுகளின் விகிதம்", opts: ["1:2", "1:4", "1:6", "1:8"], ans: "1:4", exp: "பழைய உருளையின் கன அளவு $V_1 = \\pi r^2 h$.<br>புதிய ஆரம் $= r/2$.<br>புதிய கன அளவு $V_2 = \\pi (r/2)^2 h = \\frac{\\pi r^2 h}{4} = \\frac{1}{4} V_1$.<br>விகிதம் $V_2 : V_1 = 1 : 4$." },
                { q: "ஓர் உருளையின் ஆரம் அதன் உயரத்தில் மூன்றில் ஒரு பங்கு எனில், அதன் மொத்தப் புறப்பரப்பு", opts: ["$\\frac{9\\pi h^2}{8}$ ச.அ", "$24\\pi h^2$ ச.அ", "$\\frac{8\\pi h^2}{9}$ ச.அ", "$\\frac{56\\pi h^2}{9}$ ச.அ"], ans: "$\\frac{8\\pi h^2}{9}$ ச.அ", exp: "கொடுக்கப்பட்டது $r = \\frac{h}{3}$.<br>உருளையின் மொத்தப் புறப்பரப்பு (TSA) $= 2\\pi r(h+r)$.<br>$r$-ஐ பிரதியிட: $2\\pi \\left(\\frac{h}{3}\\right) \\left(h + \\frac{h}{3}\\right) = \\frac{2\\pi h}{3} \\times \\frac{4h}{3} = \\frac{8\\pi h^2}{9}$." },
                { q: "ஓர் உள்ளீடற்ற உருளையின் வெளிப்புற மற்றும் உட்புற ஆரங்களின் கூடுதல் 14 செ.மீ மற்றும் அதன் தடிமன் 4 செ.மீ ஆகும். உருளையின் உயரம் 20 செ.மீ எனில், அதனை உருவாக்கப் பயன்பட்ட பொருளின் கன அளவு", opts: ["$5600\\pi$ க.செ.மீ", "$1120\\pi$ க.செ.மீ", "$56\\pi$ க.செ.மீ", "$3600\\pi$ க.செ.மீ"], ans: "$1120\\pi$ க.செ.மீ", exp: "கொடுக்கப்பட்டது $R+r = 14$ மற்றும் தடிமன் $R-r = 4$. உயரம் $h=20$.<br>உள்ளீடற்ற உருளையின் கன அளவு $= \\pi h (R^2 - r^2) = \\pi h (R+r)(R-r)$.<br>மதிப்புகளைப் பிரதியிட: $\\pi \\times 20 \\times (14) \\times (4) = 1120\\pi$ க.செ.மீ." },
                { q: "ஒரு கூம்பின் அடிப்புற ஆரம் மும்மடங்காகவும் உயரம் இரு மடங்காகவும் மாறினால் கன அளவு எத்தனை மடங்காக மாறும்?", opts: ["6 மடங்கு", "12 மடங்கு", "18 மடங்கு", "மாற்றமில்லை"], ans: "18 மடங்கு", exp: "ஆரம்ப கன அளவு $V = \\frac{1}{3}\\pi r^2 h$.<br>புதிய ஆரம் $R = 3r$, புதிய உயரம் $H = 2h$.<br>புதிய கன அளவு $V' = \\frac{1}{3}\\pi (3r)^2 (2h) = \\frac{1}{3}\\pi (9r^2)(2h) = 18 \\left(\\frac{1}{3}\\pi r^2 h\\right) = 18V$. (18 மடங்கு மாறும்)." },
                { q: "ஓர் அரைக்கோளத்தின் மொத்தப் பரப்பு அதன் ஆரத்தினுடைய வர்க்கத்தின் மடங்காகும்.", opts: ["$\\pi$", "$4\\pi$", "$3\\pi$", "$2\\pi$"], ans: "$3\\pi$", exp: "ஒரு திண்ம அரைக்கோளத்தின் மொத்தப் பரப்பு $= 3\\pi r^2$.<br>இது ஆரத்தினுடைய வர்க்கத்தின் ($r^2$-ன்) $3\\pi$ மடங்காகும்." },
                { q: "x செ.மீ ஆரமுள்ள ஒரு திண்மக் கோளம் அதே ஆரமுள்ள ஒரு கூம்பாக மாற்றப்படுகிறது எனில், கூம்பின் உயரம்", opts: ["3x செ.மீ", "x செ.மீ", "4x செ.மீ", "2x செ.மீ"], ans: "4x செ.மீ", exp: "கோளத்தின் கன அளவு = கூம்பின் கன அளவு.<br>$\\frac{4}{3}\\pi (x)^3 = \\frac{1}{3}\\pi (x)^2 h$.<br>இருபுறமும் $\\frac{1}{3}\\pi x^2$-ஆல் வகுக்க:<br>$4x = h \\implies h = 4x$ செ.மீ." },
                { q: "16 செ.மீ உயரமுள்ள ஒரு நேர்வட்டக் கூம்பின் இடைக்கண்ட ஆரங்கள் 8 செ.மீ மற்றும் 20 செ.மீ எனில், அதன் கன அளவு", opts: ["$3328\\pi$ க.செ.மீ", "$3228\\pi$ க.செ.மீ", "$3240\\pi$ க.செ.மீ", "$3340\\pi$ க.செ.மீ"], ans: "$3328\\pi$ க.செ.மீ", exp: "இடைக்கண்டத்தின் கன அளவு $V = \\frac{1}{3}\\pi h (R^2 + r^2 + Rr)$.<br>இங்கு $h=16, R=20, r=8$.<br>$V = \\frac{1}{3}\\pi (16) (20^2 + 8^2 + 20\\times8) = \\frac{16\\pi}{3} (400 + 64 + 160)$.<br>$V = \\frac{16\\pi}{3} (624) = 16\\pi \\times 208 = 3328\\pi$ க.செ.மீ." },
                { q: "கீழ்க்காணும் எந்த இரு உருவங்களை இணைத்தால் ஓர் இறகுபந்தின் வடிவம் கிடைக்கும்.", opts: ["உருளை மற்றும் கோளம்", "அரைக்கோளம் மற்றும் கூம்பு", "கோளம் மற்றும் கூம்பு", "கூம்பின் இடைக்கண்டம் மற்றும் அரைக்கோளம்"], ans: "கூம்பின் இடைக்கண்டம் மற்றும் அரைக்கோளம்", exp: "இறகுப்பந்தின் (Shuttlecock) அடிப்பகுதி ஒரு **அரைக்கோள** வடிவத்திலும், மேற்புற இறகுப் பகுதி கூம்பின் மேற்பகுதி வெட்டப்பட்ட **கூம்பின் இடைக்கண்ட** (Frustum) வடிவத்திலும் இருக்கும்." },
                { q: "$r_1$ அலகுகள் ஆரமுள்ள ஒரு கோளப்பந்து உருக்கப்பட்டு $r_2$ அலகுகள் ஆரமுடைய 8 சமகோள பந்துகளாக ஆக்கப்படுகிறது எனில், $r_1:r_2$", opts: ["2:1", "1:2", "4:1", "1:4"], ans: "2:1", exp: "பெரிய கோளத்தின் கன அளவு = 8 $\\times$ சிறிய கோளத்தின் கன அளவு.<br>$\\frac{4}{3}\\pi r_1^3 = 8 \\times \\frac{4}{3}\\pi r_2^3$.<br>$r_1^3 = 8r_2^3$. இருபுறமும் முப்படி மூலம் (Cube root) எடுக்க:<br>$r_1 = 2r_2 \\implies \\frac{r_1}{r_2} = \\frac{2}{1} \\implies 2:1$." },
                { q: "1 செ.மீ ஆரமும் 5 செ.மீ உயரமும் கொண்ட ஒரு மர உருளையிலிருந்து அதிகபட்சக் கன அளவு கொண்ட கோளம் வெட்டி எடுக்கப்படுகிறது எனில், அதன் கன அளவு (க.செ.மீ-ல்)", opts: ["$\\frac{4}{3}\\pi$", "$\\frac{10}{3}\\pi$", "$5\\pi$", "$\\frac{20}{3}\\pi$"], ans: "$\\frac{4}{3}\\pi$", exp: "உருளையிலிருந்து வெட்டி எடுக்கப்படும் மிகப்பெரிய கோளத்தின் விட்டம் உருளையின் விட்டத்திற்கு (2 செ.மீ) சமமாக மட்டுமே இருக்க முடியும்.<br>ஆகவே கோளத்தின் ஆரம் $r = 1$ செ.மீ.<br>கோளத்தின் கன அளவு $= \\frac{4}{3}\\pi (1)^3 = \\frac{4}{3}\\pi$ க.செ.மீ." },
                { q: "இடைக்கண்டத்தை ஒரு பகுதியாகக் கொண்ட ஒரு கூம்பின் உயரம் மற்றும் ஆரம் முறையே $h_1$ அலகுகள் மற்றும் $r_1$ அலகுகள் ஆகும். இடைக்கண்டத்தின் உயரம் மற்றும் சிறிய பக்க ஆரம் முறையே $h_2$ அலகுகள் மற்றும் $r_2$ அலகுகள் மற்றும் $h_2:h_1=1:2$ எனில், $r_2:r_1$-ன் மதிப்பு", opts: ["1:3", "1:2", "2:1", "3:1"], ans: "1:2", exp: "கூம்பை வெட்டும் போது உருவாகும் வடிவொத்த முக்கோணங்களின் பண்பின்படி:<br>$\\frac{r_2}{r_1} = \\frac{h_1 - h_2}{h_1}$.<br>கொடுக்கப்பட்டது $h_2 = \\frac{h_1}{2}$.<br>$\\frac{r_2}{r_1} = \\frac{h_1 - h_1/2}{h_1} = \\frac{h_1/2}{h_1} = \\frac{1}{2} = 1:2$." },
                { q: "சமமான விட்டம் மற்றும் உயரம் உடைய ஓர் உருளை, ஒரு கூம்பு மற்றும் ஒரு கோளத்தின் கன அளவுகளின் விகிதம்", opts: ["1:2:3", "2:1:3", "1:3:2", "3:1:2"], ans: "3:1:2", exp: "சமமான விட்டம் மற்றும் உயரம் என்பதால் $h = 2r$.<br>உருளையின் கன அளவு $V_1 = \\pi r^2 (2r) = 2\\pi r^3$<br>கூம்பின் கன அளவு $V_2 = \\frac{1}{3}\\pi r^2 (2r) = \\frac{2}{3}\\pi r^3$<br>கோளத்தின் கன அளவு $V_3 = \\frac{4}{3}\\pi r^3$<br>விகிதம்: $2 : \\frac{2}{3} : \\frac{4}{3} \\implies 6 : 2 : 4 \\implies 3 : 1 : 2$." }
            ],
            "8": [
                { q: "கீழே கொடுக்கப்பட்டவைகளில் எது பரவல் அளவை இல்லை?", opts: ["வீச்சு", "திட்டவிலக்கம்", "கூட்டுச் சராசரி", "விலக்க வர்க்கச் சராசரி"], ans: "கூட்டுச் சராசரி", exp: "வீச்சு, திட்டவிலக்கம் மற்றும் விலக்க வர்க்கச் சராசரி ஆகியவை தரவுகளின் பரவலை அளக்கும் 'பரவல் அளவைகள்' (Measures of Dispersion). ஆனால் 'கூட்டுச் சராசரி' என்பது 'மையப்போக்கு அளவை' (Central Tendency) ஆகும்." },
                { q: "8, 8, 8, 8, 8..., 8 ஆகிய தரவின் வீச்சு", opts: ["0", "1", "8", "3"], ans: "0", exp: "வீச்சு $= L - S$ (பெரிய மதிப்பு - சிறிய மதிப்பு).<br>இங்கு அனைத்து மதிப்புகளும் 8 என்பதால் பெரிய மதிப்பு = 8, சிறிய மதிப்பு = 8.<br>வீச்சு $= 8 - 8 = 0$." },
                { q: "சராசரியிலிருந்து கிடைக்கப் பெற்ற தரவுப் புள்ளிகளுடைய விலக்கங்களின் கூடுதலானது", opts: ["எப்பொழுதும் மிகை எண்", "எப்பொழுதும் குறை எண்", "பூச்சியம்", "பூச்சியமற்ற முழுக்கள்"], ans: "பூச்சியம்", exp: "எந்தவொரு தரவிற்கும் அதன் கூட்டுச் சராசரியிலிருந்து எடுக்கப்பட்ட விலக்கங்களின் கூடுதல் (Sum of deviations from arithmetic mean) எப்பொழுதும் **பூச்சியம்** (0) ஆகும். அதாவது $\\Sigma(x - \\bar{x}) = 0$." },
                { q: "100 தரவுப் புள்ளிகளின் சராசரி 40 மற்றும் திட்டவிலக்கம் 3 எனில், தரவுகளின் வர்க்கங்களின் கூடுதலானது", opts: ["40000", "160000", "160900", "30000"], ans: "160900", exp: "திட்டவிலக்கத்தின் வர்க்கம் (Variance) $\\sigma^2 = \\frac{\\Sigma x^2}{n} - (\\bar{x})^2$.<br>இங்கு $\\sigma=3, n=100, \\bar{x}=40$.<br>$3^2 = \\frac{\\Sigma x^2}{100} - 40^2 \\implies 9 = \\frac{\\Sigma x^2}{100} - 1600$.<br>$1609 = \\frac{\\Sigma x^2}{100} \\implies \\Sigma x^2 = 1609 \\times 100 = 160900$." },
                { q: "முதல் 20 இயல் எண்களின் விலக்க வர்க்கச் சராசரியானது", opts: ["32.25", "44.25", "33.25", "30"], ans: "33.25", exp: "முதல் $n$ இயல் எண்களின் விலக்க வர்க்கச் சராசரி (Variance) காணும் சூத்திரம்: $\\frac{n^2-1}{12}$.<br>இங்கு $n = 20$.<br>மதிப்பு $= \\frac{20^2-1}{12} = \\frac{400-1}{12} = \\frac{399}{12} = 33.25$." },
                { q: "ஒரு தரவின் திட்டவிலக்கமானது 3. ஒவ்வொரு மதிப்பையும் 5-ஆல் பெருக்கினால் கிடைக்கும் புதிய தரவின் விலக்க வர்க்கச் சராசரியானது", opts: ["3", "15", "5", "225"], ans: "225", exp: "தரவின் ஒவ்வொரு மதிப்பையும் ஒரு மாறிலியால் பெருக்கினால், திட்டவிலக்கமும் அந்த மாறிலியால் பெருக்கப்படும்.<br>புதிய திட்டவிலக்கம் $= 5 \\times 3 = 15$.<br>விலக்க வர்க்கச் சராசரி என்பது திட்டவிலக்கத்தின் வர்க்கம் ஆகும். எனவே புதிய வர்க்கச் சராசரி $= 15^2 = 225$." },
                { q: "x, y, z ஆகியவற்றின் திட்டவிலக்கம் p-எனில், $3x+5$, $3y+5$, $3z+5$ ஆகியவற்றின் திட்டவிலக்கமானது", opts: ["$3p+5$", "$3p$", "$p+5$", "$9p+15$"], ans: "$3p$", exp: "தரவுகளுடன் ஒரு மாறிலியைக் கூட்டுவதாலோ கழிப்பதாலோ திட்டவிலக்கம் மாறாது (+5 ஆல் மாற்றம் இல்லை).<br>ஆனால் 3-ஆல் பெருக்குவதால் திட்டவிலக்கமும் 3 மடங்கு ஆகும்.<br>எனவே புதிய திட்டவிலக்கம் $= 3 \\times p = 3p$." },
                { q: "ஒரு தரவின் சராசரி மற்றும் மாறுபாட்டுக் கெழு முறையே 4 மற்றும் 87.5% எனில் திட்டவிலக்கமானது", opts: ["3.5", "4.5", "3", "2.5"], ans: "3.5", exp: "மாறுபாட்டுக் கெழு $C.V = \\frac{\\sigma}{\\bar{x}} \\times 100$.<br>மதிப்புகளைப் பிரதியிட: $87.5 = \\frac{\\sigma}{4} \\times 100$.<br>$\\sigma = \\frac{87.5 \\times 4}{100} = \\frac{350}{100} = 3.5$." },
                { q: "கொடுக்கப்பட்டவைகளில் எது தவறானது?", opts: ["$P(A)>1$", "$P(\\phi)=0$", "$0\\le P(A)\\le1$", "$P(A)+P(\\overline{A})=1$"], ans: "$P(A)>1$", exp: "எந்தவொரு நிகழ்ச்சியின் நிகழ்தகவும் 0-க்கும் 1-க்கும் இடையில் மட்டுமே இருக்கும் ($0 \\le P(A) \\le 1$).<br>எனவே ஒரு நிகழ்தகவு 1-ஐ விட அதிகம் ($P(A) > 1$) என்று கூறுவது முற்றிலும் தவறானது." },
                { q: "p சிவப்பு, q நீல, r பச்சை நிறக் கூழாங்கற்கள் உள்ள ஒரு குடுவையில் இருந்து ஒரு சிவப்பு கூழாங்கல் எடுப்பதற்கான நிகழ்தகவானது", opts: ["$\\frac{q}{p+q+r}$", "$\\frac{p}{p+q+r}$", "$\\frac{p+q}{p+q+r}$", "$\\frac{p+r}{p+q+r}$"], ans: "$\\frac{p}{p+q+r}$", exp: "நிகழ்தகவு $= \\frac{\\text{சாதகமான விளைவுகள்}}{\\text{மொத்த விளைவுகள்}}$.<br>சிவப்பு கூழாங்கற்கள் $= p$.<br>மொத்த கூழாங்கற்கள் $= p + q + r$.<br>நிகழ்தகவு $= \\frac{p}{p+q+r}$." },
                { q: "ஒரு புத்தகத்திலிருந்து சமவாய்ப்பு முறையில் ஒரு பக்கம் தேர்ந்தெடுக்கப்படுகிறது. அந்தப் பக்க எண்ணின் ஒன்றாம் இட மதிப்பானது 7-ஐ விடக் குறைவாக இருப்பதற்கான நிகழ்தகவானது", opts: ["$\\frac{3}{10}$", "$\\frac{7}{10}$", "$\\frac{3}{9}$", "$\\frac{7}{9}$"], ans: "$\\frac{7}{10}$", exp: "ஒன்றாம் இட இலக்கங்கள் 0 முதல் 9 வரை இருக்கலாம் (மொத்தம் 10).<br>இதில் 7-ஐ விடக் குறைவான எண்கள்: 0, 1, 2, 3, 4, 5, 6 (மொத்தம் 7 எண்கள்).<br>எனவே நிகழ்தகவு $= \\frac{7}{10}$." },
                { q: "ஒரு நபருக்கு வேலை கிடைப்பதற்கான நிகழ்தகவானது $\\frac{x}{3}$. வேலை கிடைக்காமல் இருப்பதற்கான நிகழ்தகவு $\\frac{2}{3}$ எனில் x-யின் மதிப்பானது", opts: ["2", "1", "3", "1.5"], ans: "1", exp: "ஒரு நிகழ்ச்சி நடப்பதற்கான மற்றும் நடக்காமல் இருப்பதற்கான நிகழ்தகவுகளின் கூடுதல் எப்பொழுதும் 1 ஆகும்.<br>$P(E) + P(\\overline{E}) = 1$<br>$\\frac{x}{3} + \\frac{2}{3} = 1 \\implies \\frac{x+2}{3} = 1 \\implies x+2 = 3 \\implies x = 1$." },
                { q: "கமலம், குலுக்கல் போட்டியில் கலந்துகொண்டாள். அங்கு மொத்தம் 135 சீட்டுகள் விற்கப்பட்டன. கமலம் வெற்றி பெறுவதற்கான வாய்ப்பு $\\frac{1}{9}$ எனில் கமலம் வாங்கிய சீட்டுகளின் எண்ணிக்கை,", opts: ["5", "10", "15", "20"], ans: "15", exp: "கமலம் வாங்கிய சீட்டுகள் $t$ என்க. மொத்த சீட்டுகள் = 135.<br>வெற்றி பெறுவதற்கான நிகழ்தகவு $= \\frac{t}{135}$.<br>கொடுக்கப்பட்டுள்ளது: $\\frac{t}{135} = \\frac{1}{9} \\implies t = \\frac{135}{9} = 15$." },
                { q: "ஆங்கில எழுத்துகள் $\\{a,b,\\dots,z\\}$-யிலிருந்து ஓர் எழுத்து சமவாய்ப்பு முறையில் தேர்வு செய்யப்படுகிறது. அந்த எழுத்து x-க்கு முந்தைய எழுத்துகளில் ஒன்றாக இருப்பதற்கான நிகழ்தகவு", opts: ["$\\frac{12}{13}$", "$\\frac{1}{13}$", "$\\frac{23}{26}$", "$\\frac{3}{26}$"], ans: "$\\frac{23}{26}$", exp: "மொத்த ஆங்கில எழுத்துகள் 26.<br>x என்பது 24-வது எழுத்து. இதற்கு முந்தைய எழுத்துகள் a முதல் w வரை, மொத்தம் 23 உள்ளன.<br>எனவே நிகழ்தகவு $= \\frac{23}{26}$." },
                { q: "ஒரு பணப்பையில் ₹2000 நோட்டுகள் 10-ம், ₹500 நோட்டுகள் 15-ம், ₹200 நோட்டுகள் 25-ம் உள்ளன. ஒரு நோட்டு சமவாய்ப்பு முறையில் எடுக்கப்படுகின்றது எனில், அந்த நோட்டு ₹500 நோட்டாகவோ அல்லது ₹200 நோட்டாகவோ இருப்பதற்கான நிகழ்தகவு என்ன?", opts: ["$\\frac{1}{5}$", "$\\frac{3}{10}$", "$\\frac{2}{3}$", "$\\frac{4}{5}$"], ans: "$\\frac{4}{5}$", exp: "மொத்த நோட்டுகள் $= 10 + 15 + 25 = 50$.<br>சாதகமான நோட்டுகள் (₹500 அல்லது ₹200) $= 15 + 25 = 40$.<br>நிகழ்தகவு $= \\frac{40}{50} = \\frac{4}{5}$." }
            ]
        };

        // Fallback generator for Tamil Explanations for Chapters 5 to 8
        let allQuestions = [];
        for (let key in quizDatabase) {
            quizDatabase[key].forEach(q => {
                if(!q.exp) {
                    q.exp = `<div style="background:#f1f5f9; padding: 10px; border-radius: 8px;">கணித விதிகளின்படி, சரியான விடை <b>${q.ans}</b> ஆகும்.</div>`;
                }
                allQuestions.push(q);
            });
        }

        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let rewards = 0;
        let timerInterval;
        let timeLeft = 30;
        let isLocked = false;

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

		function startQuiz() {
            initAudio();
            const chapterKey = document.getElementById('chapterSelect').value;
            const orderMode = document.getElementById('orderSelect').value;

            // தேர்ந்தெடுக்கப்பட்ட பாடத்தின் பெயரை தலைப்பில் காட்டுவதற்கான புதிய கோடு
            const chapterDropdown = document.getElementById('chapterSelect');
            const selectedChapterName = chapterDropdown.options[chapterDropdown.selectedIndex].text;
            document.getElementById('dynamic-quiz-title').innerHTML = `10-ஆம் வகுப்பு கணிதம்<br><span style="font-size: 0.8em; color: #fde68a;">(${selectedChapterName})</span>`;

            if(chapterKey === "master") currentQuestions = [...allQuestions];
            else currentQuestions = quizDatabase[chapterKey] ? [...quizDatabase[chapterKey]] : [];

            if (orderMode === 'shuffled') currentQuestions = shuffleArray(currentQuestions);

            if(currentQuestions.length === 0) { alert("வினாக்கள் கிடைக்கவில்லை."); return; }

            document.getElementById('start-section').classList.add('hidden');
            document.getElementById('quiz-section').classList.remove('hidden');

            currentIndex = 0;
            score = 0;
            rewards = 0;
            
            showQuestion(currentIndex);
        }

        function showQuestion(index) {
            isLocked = false;
            document.getElementById('explanation').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            
            document.getElementById('q-counter').innerText = `வினா: ${index + 1}/${currentQuestions.length}`;
            
            const qObj = currentQuestions[index];
            const container = document.getElementById('single-question-container');
            
            // Tamil Options
            const optionLabels = ['(அ)', '(ஆ)', '(இ)', '(ஈ)'];

            let optionsHtml = '';
            qObj.opts.forEach((opt, optIndex) => {
                optionsHtml += `
                    <div class="option-label" id="lbl-o${optIndex}" onclick="handleAnswer(${optIndex})">
                        <span class="opt-letter">${optionLabels[optIndex]}</span>
                        <span>${opt}</span>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="q-text">${index + 1}. ${qObj.q}</div>
                ${qObj.svg ? `<div class="svg-container">${qObj.svg}</div>` : ''}
                <div class="options-list">${optionsHtml}</div>
            `;

            MathJax.typesetPromise();
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            updateTimerUI();
            
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    autoLockTimeOut();
                }
            }, 1000);
        }

        function updateTimerUI() {
            document.getElementById('time-text').innerHTML = `<i class="fa-regular fa-clock"></i> நேரம்: ${timeLeft}s`;
        }

        function handleAnswer(optIndex) {
            if (isLocked) return;
            isLocked = true;
            clearInterval(timerInterval);

            const qObj = currentQuestions[currentIndex];
            const selectedValue = qObj.opts[optIndex];
            const correctValue = qObj.ans;
            const isCorrect = (selectedValue === correctValue);

            playSound(isCorrect);
            revealAnswers(optIndex, correctValue);

            const popup = document.getElementById('result-popup');
            const popupIcon = document.getElementById('popup-icon');
            const popupText = document.getElementById('popup-text');
            
            popup.className = 'overlay-popup show';
            
            if (isCorrect) {
                score++;
                rewards += (10 + timeLeft); 
                popup.classList.add('correct');
                popupIcon.innerHTML = '<i class="fa-solid fa-star star-icon"></i>'; 
                popupText.innerText = 'மிகச் சரி!';
                
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    zIndex: 200
                });
                
            } else {
                popup.classList.add('wrong');
                popupIcon.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                popupText.innerText = 'தவறு!';
            }

            setTimeout(() => {
                popup.classList.remove('show');
                showExplanation(correctValue, qObj.exp);
            }, 1500);
        }

        function autoLockTimeOut() {
            if (isLocked) return;
            isLocked = true;
            playSound(false); 
            revealAnswers(-1, currentQuestions[currentIndex].ans);
            
            const popup = document.getElementById('result-popup');
            popup.className = 'overlay-popup show wrong';
            document.getElementById('popup-icon').innerHTML = '<i class="fa-solid fa-clock"></i>';
            document.getElementById('popup-text').innerText = 'நேரம் முடிந்தது!';
            
            setTimeout(() => {
                popup.classList.remove('show');
                showExplanation(currentQuestions[currentIndex].ans, currentQuestions[currentIndex].exp);
            }, 1500);
        }

        function revealAnswers(selectedIdx, correctValue) {
            const qObj = currentQuestions[currentIndex];
            
            qObj.opts.forEach((opt, idx) => {
                const label = document.getElementById(`lbl-o${idx}`);
                label.classList.add('disabled'); 
                
                if (opt === correctValue) {
                    label.classList.add('correct-answer');
                } else if (idx === selectedIdx) {
                    label.classList.add('wrong-answer');
                }
            });
        }

        function showExplanation(correctAnswer, expText) {
            const expDiv = document.getElementById('explanation');
            
            let txt = `<div class="exp-title"><i class="fa-solid fa-book-open"></i> விரிவான விளக்கம்</div>`;
            txt += `<strong>சரியான விடை:</strong> <span style="color: var(--correct-green); font-size: 1.1em;">${correctAnswer}</span><br><br>`;
            txt += `${expText}`;
            
            expDiv.innerHTML = txt;
            expDiv.style.display = 'block';
            
            MathJax.typesetPromise([expDiv]).then(() => {
                const nxtBtn = document.getElementById('next-btn');
                if (currentIndex === currentQuestions.length - 1) {
                    nxtBtn.innerHTML = `முடிவு அறிக்கை <i class="fa-solid fa-flag-checkered"></i>`;
                    nxtBtn.style.backgroundColor = "#ea580c";
                } else {
                    nxtBtn.innerHTML = `அடுத்த வினா <i class="fa-solid fa-arrow-right"></i>`;
                    nxtBtn.style.backgroundColor = "var(--header-blue)";
                }
                nxtBtn.style.display = 'block';
            });
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuestions.length) {
                showQuestion(currentIndex);
            } else {
                generateReport();
            }
        }

        function generateReport() {
            document.getElementById('quiz-section').classList.add('hidden');
            document.getElementById('report-section').classList.remove('hidden');

            let total = currentQuestions.length;
            let wrongCount = total - score;

            document.getElementById('rep-score-text').innerText = `${score} / ${total}`;
            document.getElementById('rep-correct').innerText = score;
            document.getElementById('rep-wrong').innerText = wrongCount;
            document.getElementById('rep-rewards').innerText = rewards;
        }
    </script>
</body>
</html>
